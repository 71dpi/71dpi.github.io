<title>Pull My Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: a hard-edged square picture floating on pure white; tiny VT323 chrome in the top corners */
:root {
  --paper: #ffffff;
  --ink: #0b0b0b;
  --mono: 'VT323', ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--mono); }
#c {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; cursor: default; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#fallback { position: fixed; left: 50%; top: 50%; height: 92vmin; width: 92vmin; max-width: none; transform: translate(-50%, -50%); }
.chrome {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.btns { display: flex; gap: 8px; margin-left: auto; }
.hint { white-space: nowrap; font-size: 26px; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; transition: opacity .3s steps(3); }
.hint::after { content: "_"; animation: blink 1s steps(1) infinite; }
.hint.gone { opacity: 0; }
@keyframes blink { 50% { opacity: 0; } }
#crt, #neon {
  pointer-events: auto; font: inherit; font-size: 22px; line-height: 1; letter-spacing: 0.06em;
  color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 0;
  padding: 6px 10px 4px; cursor: pointer; min-height: 36px; white-space: nowrap;
}
#crt[aria-pressed="true"], #neon[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#crt:focus-visible, #neon:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
@media (max-width: 520px) { .hint { font-size: 20px; } #crt, #neon { font-size: 18px; padding: 5px 8px 3px; min-height: 32px; } }
@media (prefers-reduced-motion: reduce) { .hint::after { animation: none; } }
</style>

<canvas id="c" role="img" aria-label="Interactive portrait in a square frame on a white background. Press and drag to stretch it like a rough low-poly mesh."></canvas>
<div class="chrome">
  <div class="hint" id="hint">Pull the face</div>
  <div class="btns">
    <button id="neon" type="button" aria-pressed="true">NEON on</button>
    <button id="crt" type="button" aria-pressed="false">FX auto</button>
  </div>
</div>

  function makeTarget() {
    if (scene) gl.deleteTexture(scene);
    if (fbo) gl.deleteFramebuffer(fbo);
    scene = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, scene);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sw, sh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, scene, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cw = Math.round(W * dpr); ch = Math.round(H * dpr);
    canvas.width = cw; canvas.height = ch;
    TOP = W < 520 ? 100 : 56;
    size = Math.min(W * 0.92, (H - TOP) * 0.94);
    offX = (W - size) / 2; offY = (H - TOP - size) / 2;
    sh = SCENE_H; sw = Math.max(2, Math.round(SCENE_H * W / H));
    makeTarget();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- state
  let mode = 'auto';            // 'auto' = effects only while touched, 'on' = always
  let crt = 0, neon = 1, neonOn = true;
  let drag = false, pid = -1;
  const grab = { u: 0.5, v: 0.5 };
  const tgt = { x: 0, y: 0 };
  let dx = 0, dy = 0, vx = 0, vy = 0;      // live spring
  let spull = 0, acc = 0;                  // mesh state is sampled in 30 Hz steps
  let hovering = false, hov = 0;
  const cur = { sx: 0.5, sy: 0.5 };
  let gS = 0, burst = 0, nextBurst = 2 + Math.random() * 3;
  let lastP = null, lastPos = null, speed = 0;

  // pointer (client px) -> mesh uv + screen coords
  function toImg(clientX, clientY) {
    const sx = clientX / W, sy = 1 - clientY / H;
    return { u: (sx * W - offX) / size, v: (sy * H - offY) / size, sx, sy };
  }
  const inside = p => p.u >= 0 && p.u <= 1 && p.v >= 0 && p.v <= 1;

  canvas.addEventListener('pointerdown', e => {
    if (drag) return;
    const p = toImg(e.clientX, e.clientY);
    if (!inside(p)) return;
    canvas.setPointerCapture(e.pointerId);
    const still = Math.hypot(dx, dy) > 0.01 && Math.hypot(p.u - (grab.u + dx), p.v - (grab.v + dy)) < 0.3;
    if (!still) { grab.u = p.u; grab.v = p.v; dx = dy = vx = vy = 0; }
    tgt.x = p.u - grab.u; tgt.y = p.v - grab.v;
    drag = true; pid = e.pointerId;
    burst = Math.max(burst, 1.0);
    canvas.style.cursor = 'grabbing';
    hint.classList.add('gone');
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    const p = toImg(e.clientX, e.clientY);
    cur.sx = p.sx; cur.sy = p.sy;
    if (!drag) {
      const now = inside(p);
      hovering = now;
      canvas.style.cursor = now ? 'grab' : 'default';
    }
    if (drag && e.pointerId === pid) {
      const rx = p.u - grab.u, ry = p.v - grab.v;
      const len = Math.hypot(rx, ry) || 1e-6, max = 0.7;
      const k = max * Math.tanh(len / max) / len;
      tgt.x = rx * k; tgt.y = ry * k;
    }
    lastPos = [e.clientX, e.clientY];
  });
  canvas.addEventListener('pointerleave', () => { if (!drag) { hovering = false; canvas.style.cursor = 'default'; } });
  function release(e) {
    if (!drag || e.pointerId !== pid) return;
    drag = false; pid = -1; burst = Math.max(burst, 0.5);
    canvas.style.cursor = 'grab';
    if (e.pointerType !== 'mouse') hovering = false;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  crtBtn.addEventListener('click', () => {
    mode = mode === 'auto' ? 'on' : 'auto';
    crtBtn.setAttribute('aria-pressed', String(mode === 'on'));
    crtBtn.textContent = mode === 'on' ? 'FX always' : 'FX auto';
    if (mode === 'on') burst = Math.max(burst, 0.8);
  });

  neonBtn.addEventListener('click', () => {
    neonOn = !neonOn;
    neonBtn.setAttribute('aria-pressed', String(neonOn));
    neonBtn.textContent = neonOn ? 'NEON on' : 'NEON off';
    if (neonOn) burst = Math.max(burst, 1.0);   // preview it straight away
  });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;

    // spring: stiff and snappy while held, a violent twang on release
    const k = drag ? 900 : 260, c = drag ? 60 : 3.5;
    const tx = drag ? tgt.x : 0, ty = drag ? tgt.y : 0;
    let rem = dt;
    while (rem > 1e-6) {
      const s = Math.min(1 / 240, rem); rem -= s;
      vx += (-k * (dx - tx) - c * vx) * s;
      vy += (-k * (dy - ty) - c * vy) * s;
      dx += vx * s; dy += vy * s;
    }
    if (!drag && Math.abs(dx) + Math.abs(dy) < 1e-4 && Math.abs(vx) + Math.abs(vy) < 1e-3) { dx = dy = vx = vy = 0; }
    const pull = Math.min(1, Math.hypot(dx, dy) / 0.5);

    // the mesh only updates in 30 Hz steps
    acc += dt;
    if (acc >= TICK) { acc %= TICK; hist.push([dx, dy]); if (hist.length > HIST) hist.shift(); spull = pull; }

    // pointer speed -> glitch
    if (lastPos) {
      if (lastP) speed += (Math.hypot(lastPos[0] - lastP[0], lastPos[1] - lastP[1]) / H / dt - speed) * Math.min(1, dt * 12);
      lastP = lastPos;
    }
    if (!hovering && !drag) speed *= Math.exp(-dt * 6);

    if (mode === 'on' && !reduce) {
      nextBurst -= dt;
      if (nextBurst <= 0) { burst = Math.max(burst, 0.45 + Math.random() * 0.4); nextBurst = 2.5 + Math.random() * 3.5; }
    }
    const base = reduce ? 0.02 : 0.06;
    const want = base + (hovering ? 0.28 : 0) + Math.min(0.5, speed * 0.35) + (drag ? 0.4 + 0.35 * pull : 0) + pull * 0.15;
    gS += (want - gS) * (1 - Math.exp(-dt * (want > gS ? 14 : 4)));
    burst *= Math.exp(-dt * 3.5);
    const G = Math.min(1.3, gS + burst);

    hov += (((hovering || drag) ? 1 : 0) - hov) * (1 - Math.exp(-dt * (hovering ? 12 : 3)));

    // CRT level: always on, or only while touched / wobbling
    const active = drag || pull > 0.02 || burst > 0.15;
    const crtTarget = mode === 'on' ? 1 : (active ? 1 : 0);
    crt += (crtTarget - crt) * (1 - Math.exp(-dt * (crtTarget > crt ? 14 : 3)));
    if (crt < 0.002 && crtTarget === 0) crt = 0;

    // resting: the clean full-res photo. touched: rough low-res mesh -> offscreen target, then CRT pass
    const ps1 = crt > 0.002 || crtTarget === 1;
    if (!ps1) { dx = dy = vx = vy = 0; hist.length = 0; spull = 0; }
    buildMesh(grab, spull, ps1);
    gl.bindFramebuffer(gl.FRAMEBUFFER, ps1 ? fbo : null);
    gl.viewport(0, 0, ps1 ? sw : cw, ps1 ? sh : ch);
    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(P1);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, ps1 ? faceLo : faceHi);
    gl.uniform1i(U1.uTex, 0);
    gl.uniform1f(U1.uClean, ps1 ? 0 : 1);
    gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(A1.pos); gl.vertexAttribPointer(A1.pos, 2, gl.FLOAT, false, 20, 0);
    gl.enableVertexAttribArray(A1.uv); gl.vertexAttribPointer(A1.uv, 2, gl.FLOAT, false, 20, 8);
    gl.enableVertexAttribArray(A1.shade); gl.vertexAttribPointer(A1.shade, 1, gl.FLOAT, false, 20, 16);
    gl.drawArrays(gl.TRIANGLES, 0, TRI * 3);
    gl.disableVertexAttribArray(A1.pos); gl.disableVertexAttribArray(A1.uv); gl.disableVertexAttribArray(A1.shade);
    if (!ps1) { requestAnimationFrame(frame); return; }

    // pass 2: CRT -> screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cw, ch);
    gl.useProgram(P2);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, scene);
    gl.uniform1i(U2.uScene, 1);
    gl.uniform2f(U2.uRes, cw, ch);
    gl.uniform1f(U2.uPx, dpr);
    gl.uniform1f(U2.uSize, size * dpr);
    gl.uniform1f(U2.uMot, MOT);
    gl.uniform1f(U2.uTime, (now / 1000) % 1000);
    gl.uniform1f(U2.uG, G);
    gl.uniform2f(U2.uCur, cur.sx, cur.sy);
    gl.uniform1f(U2.uHov, hov);
    neon += ((neonOn ? 1 : 0) - neon) * (1 - Math.exp(-dt * 8));
    gl.uniform1f(U2.uCrt, crt);
    gl.uniform1f(U2.uNeon, neon);
    gl.uniform2f(U2.uScenePx, 1 / sw, 1 / sh);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(A2); gl.vertexAttribPointer(A2, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(A2);
    requestAnimationFrame(frame);
  }

  let faceHi = null, faceLo = null;
  const img = new Image();
  img.onload = () => {
    gl.activeTexture(gl.TEXTURE0);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    // full-quality texture for the resting photo
    faceHi = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, faceHi);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    // tiny blocky texture for the rough look
    const small = document.createElement('canvas');
    small.width = small.height = 256;
    const sctx = small.getContext('2d');
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(img, 0, 0, 256, 256);
    faceLo = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, faceLo);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, small);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    requestAnimationFrame(frame);
  };
  img.src = IMG;
})();
</script>
