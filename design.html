    .skip-link {

      line-height: 2rem;

      margin: 0 10%;
      padding-bottom: 1rem;
    }

    .inline-links {
      display: inline-block;
      margin: 0 10% 2rem;
    }

    .inline-links a {
      margin-right: 1.25rem;
      color: #6236ff;
      text-decoration: underline #fff200;
    }

    .inline-links a:hover {
      color: #4d25e0;
      text-decoration: underline #4d25e0;
    }

    /* footer hugs the bottom of the viewport */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 0.75rem 0;
      font-size: .75rem;
