<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WHACK</title>
  <meta name="theme-color" content="#FF6B00">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF6B00; --color-accent: #FFF200; }
    #game-screen { background: #FF6B00; }
    #holes-grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 16px;
      margin: 0 auto;
    }
    .hole {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2a1500;
      border: 5px solid #000;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.6), 4px 4px 0 #000;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .hole-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      transform: translateY(100%);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .hole.active .hole-content {
      transform: translateY(0);
    }
    .hole.whacked .hole-content {
      transform: translateY(100%);
    }
    #attempts-display {
      font-size: 1rem;
      font-weight: 900;
      color: #000;
      text-align: center;
    }
    #hit-feedback {
      font-size: 2rem;
      text-align: center;
      min-height: 2.5rem;
      font-weight: 900;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .hit-flash {
      animation: hitFlash 0.3s ease;
    }
    @keyframes hitFlash {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); background: #FFF200; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">WHACK</h1>
    <div class="game-subject">🦔</div>
    <p class="game-tagline">Tap the mole when it pops up!<br>Win: hit it on first try!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <p id="attempts-display">Attempts: 5</p>
    <div id="holes-grid">
      <div class="hole" data-i="0"><div class="hole-content">🦔</div></div>
      <div class="hole" data-i="1"><div class="hole-content">🦔</div></div>
      <div class="hole" data-i="2"><div class="hole-content">🦔</div></div>
      <div class="hole" data-i="3"><div class="hole-content">🦔</div></div>
      <div class="hole" data-i="4"><div class="hole-content">🦔</div></div>
      <div class="hole" data-i="5"><div class="hole-content">🦔</div></div>
    </div>
    <div id="hit-feedback">💥</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">💥</div>
    <p class="game-tagline">Hit!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">😤</div>
    <p class="game-tagline">Too slow!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'whack';
    const screens = { start: document.getElementById('start-screen'), game: document.getElementById('game-screen'), win: document.getElementById('win-screen'), lose: document.getElementById('lose-screen') };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }
    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 10;
    function runTimer() {
      const e = (Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width = Math.max(0,(1-e/TIME_LIMIT)*100)+'%';
      if (e >= TIME_LIMIT) triggerLose(); else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning=false; cancelAnimationFrame(timerRAF); clearTimeout(moleTimer); clearTimeout(hideTimer); setTimeout(()=>show('win'),400); }
    function triggerLose() { gameRunning=false; cancelAnimationFrame(timerRAF); clearTimeout(moleTimer); clearTimeout(hideTimer); show('lose'); }

    // WHACK GAME
    const holes = Array.from(document.querySelectorAll('.hole'));
    const attemptsDisplay = document.getElementById('attempts-display');
    const hitFeedback = document.getElementById('hit-feedback');
    let activeHole, attempts, moleTimer, hideTimer;

    function clearAllHoles() {
      holes.forEach(h => { h.classList.remove('active','whacked'); });
      activeHole = -1;
    }

    function popMole() {
      clearAllHoles();
      const idx = Math.floor(Math.random() * holes.length);
      activeHole = idx;
      holes[idx].classList.add('active');

      // Hide after 0.8s
      hideTimer = setTimeout(() => {
        holes[idx].classList.remove('active');
        activeHole = -1;
        if (gameRunning) moleTimer = setTimeout(popMole, 300 + Math.random() * 400);
      }, 800);
    }

    holes.forEach(h => {
      h.addEventListener('click', () => {
        if (!gameRunning) return;
        const i = parseInt(h.dataset.i);
        if (i === activeHole) {
          // Hit!
          clearTimeout(hideTimer);
          h.classList.remove('active');
          h.classList.add('whacked');
          h.classList.add('hit-flash');
          hitFeedback.textContent = '💥';
          hitFeedback.style.opacity = '1';
          setTimeout(() => { hitFeedback.style.opacity = '0'; }, 500);
          clearTimeout(moleTimer);
          triggerWin();
        } else {
          // Miss
          attempts--;
          attemptsDisplay.textContent = `Attempts: ${attempts}`;
          hitFeedback.textContent = '❌';
          hitFeedback.style.opacity = '1';
          setTimeout(() => { hitFeedback.style.opacity = '0'; }, 400);
          if (attempts <= 0) triggerLose();
        }
      });
    });

    function startGame() {
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      attempts = 5;
      attemptsDisplay.textContent = 'Attempts: 5';
      hitFeedback.style.opacity = '0';
      clearAllHoles();
      // First mole appears after short delay
      moleTimer = setTimeout(popMole, 600);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
