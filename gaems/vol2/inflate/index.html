<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>INFLATE</title>
  <meta name="theme-color" content="#FF0062">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF0062; --color-accent: #FFF200; }
    #game-screen { background: #FF0062; }
    #balloon {
      font-size: 2rem;
      line-height: 1;
      text-align: center;
      display: block;
      transition: font-size 0.1s cubic-bezier(0.34,1.56,0.64,1);
      user-select: none;
    }
    #pump-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #FFF200;
      border: 5px solid #000;
      box-shadow: 4px 4px 0 #000;
      font-size: 2.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.08s;
      user-select: none;
    }
    #pump-btn:active {
      transform: translate(3px,3px) scale(0.9);
      box-shadow: 1px 1px 0 #000;
    }
    #progress-wrap {
      width: 200px;
      height: 20px;
      background: #fff;
      border: 4px solid #000;
      border-radius: 10px;
      box-shadow: 3px 3px 0 #000;
      overflow: hidden;
      margin: 0 auto;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #FFF200;
      border-radius: 6px;
      transition: width 0.1s;
    }
    #tap-count {
      font-size: 1rem;
      font-weight: 900;
      color: #000;
      text-align: center;
    }
    @keyframes popBurst {
      0% { transform: scale(1); opacity:1; }
      50% { transform: scale(2.5); opacity: 0.7; }
      100% { transform: scale(3); opacity: 0; }
    }
    .balloon-pop {
      animation: popBurst 0.4s ease forwards;
    }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">INFLATE</h1>
    <div class="game-subject">🎈</div>
    <p class="game-tagline">Tap the pump to inflate!<br>Win: fill it to full size!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <span id="balloon">🎈</span>
    <div id="progress-wrap"><div id="progress-fill"></div></div>
    <p id="tap-count">0 / 16 taps</p>
    <button id="pump-btn">💨</button>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🎉</div>
    <p class="game-tagline">Full size!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">😮‍💨</div>
    <p class="game-tagline">Out of breath!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'inflate';
    const screens = { start: document.getElementById('start-screen'), game: document.getElementById('game-screen'), win: document.getElementById('win-screen'), lose: document.getElementById('lose-screen') };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }
    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 7;
    function runTimer() {
      const e = (Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width = Math.max(0,(1-e/TIME_LIMIT)*100)+'%';
      if (e >= TIME_LIMIT) triggerLose(); else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning=false; cancelAnimationFrame(timerRAF); setTimeout(()=>show('win'),500); }
    function triggerLose() { gameRunning=false; cancelAnimationFrame(timerRAF); show('lose'); }

    // INFLATE GAME
    const balloon = document.getElementById('balloon');
    const progressFill = document.getElementById('progress-fill');
    const tapCount = document.getElementById('tap-count');
    const pumpBtn = document.getElementById('pump-btn');

    // 2rem start → 7rem target (16 taps, 0.3125rem per tap)
    const START_SIZE = 2;
    const TARGET_SIZE = 7;
    const TAP_STEP = (TARGET_SIZE - START_SIZE) / 16;
    let currentSize, taps;

    function updateBalloon() {
      balloon.style.fontSize = currentSize + 'rem';
      const pct = ((currentSize - START_SIZE) / (TARGET_SIZE - START_SIZE)) * 100;
      progressFill.style.width = Math.min(100, pct) + '%';
      const t = Math.round((currentSize - START_SIZE) / TAP_STEP);
      tapCount.textContent = `${Math.min(t, 16)} / 16 taps`;
    }

    pumpBtn.addEventListener('click', () => {
      if (!gameRunning) return;
      taps++;
      currentSize = Math.min(TARGET_SIZE, START_SIZE + taps * TAP_STEP);
      updateBalloon();

      // Pump visual feedback
      pumpBtn.style.transform = 'translate(3px,3px) scale(0.85)';
      setTimeout(() => { pumpBtn.style.transform = ''; }, 100);

      if (currentSize >= TARGET_SIZE) {
        balloon.classList.add('balloon-pop');
        triggerWin();
      }
    });

    function startGame() {
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      taps = 0;
      currentSize = START_SIZE;
      balloon.classList.remove('balloon-pop');
      balloon.textContent = '🎈';
      updateBalloon();
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
