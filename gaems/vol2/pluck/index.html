<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PLUCK</title>
  <meta name="theme-color" content="#FF3EDB">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF3EDB; --color-accent: #FFF200; }
    #game-screen { background: #FF3EDB; touch-action: none; }
    #head-area {
      position: relative;
      width: 220px;
      height: 260px;
      margin: 0 auto;
    }
    #head-emoji {
      font-size: 7rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      user-select: none;
      pointer-events: none;
    }
    .hair {
      position: absolute;
      border-radius: 3px;
      cursor: pointer;
      transform-origin: bottom center;
      transition: transform 0.1s;
    }
    .hair:active { transform: scaleY(0.6); }
    .hair.gray-hair {
      background: #aaa !important;
      width: 5px !important;
      height: 20px !important;
      border: 1.5px solid #888;
    }
    #instruction {
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      color: #000;
      animation: pulse 1s ease infinite;
    }
    @keyframes pluckPop {
      0% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-80%) scale(1.5); opacity:0.8; }
      100% { transform: translate(-50%,-100%) scale(0.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">PLUCK</h1>
    <div class="game-subject">👴</div>
    <p class="game-tagline">Find and tap the gray hair!<br>Win: pluck it!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <p id="instruction">TAP THE GRAY HAIR!</p>
    <div id="head-area">
      <span id="head-emoji">👴</span>
    </div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">✨</div>
    <p class="game-tagline">Plucked!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">😤</div>
    <p class="game-tagline">Wrong hair!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'pluck';
    const screens = { start: document.getElementById('start-screen'), game: document.getElementById('game-screen'), win: document.getElementById('win-screen'), lose: document.getElementById('lose-screen') };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }
    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 7;
    function runTimer() {
      const e = (Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width = Math.max(0,(1-e/TIME_LIMIT)*100)+'%';
      if (e >= TIME_LIMIT) triggerLose(); else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning=false; cancelAnimationFrame(timerRAF); setTimeout(()=>show('win'),300); }
    function triggerLose() { gameRunning=false; cancelAnimationFrame(timerRAF); show('lose'); }

    // PLUCK GAME
    const headArea = document.getElementById('head-area');
    const BROWN_SHADES = ['#5c3317','#7B4E2D','#8B5E3C','#6B3A2A','#4a2e0e'];

    function spawnHairs() {
      // Remove old hairs
      headArea.querySelectorAll('.hair').forEach(h => h.remove());
      const NUM = 30;
      const grayIdx = Math.floor(Math.random() * NUM);
      // Area: 220x260, head center ~110,130, avoid center face area
      for (let i = 0; i < NUM; i++) {
        const h = document.createElement('div');
        h.className = 'hair';
        if (i === grayIdx) {
          h.classList.add('gray-hair');
        }
        // Scatter around head, bias to top/sides
        let x, y, attempts = 0;
        do {
          x = 20 + Math.random() * 180;
          y = 10 + Math.random() * 180;
          attempts++;
        } while (attempts < 20 && Math.hypot(x - 110, y - 100) < 45);

        h.style.left = x + 'px';
        h.style.top = y + 'px';

        if (!h.classList.contains('gray-hair')) {
          const shade = BROWN_SHADES[Math.floor(Math.random() * BROWN_SHADES.length)];
          h.style.background = shade;
          h.style.width = (3 + Math.random() * 2) + 'px';
          h.style.height = (10 + Math.random() * 8) + 'px';
          h.style.transform = `rotate(${(Math.random()-0.5)*40}deg)`;
        }

        h.addEventListener('click', () => {
          if (!gameRunning) return;
          if (h.classList.contains('gray-hair')) {
            h.style.animation = 'pluckPop 0.35s ease forwards';
            triggerWin();
          } else {
            h.style.background = '#FF3232';
            h.style.transform = 'scaleY(1.5)';
            setTimeout(() => { if (h.parentNode) h.style.transform = ''; }, 200);
            triggerLose();
          }
        });

        headArea.appendChild(h);
      }
    }

    function startGame() {
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      spawnHairs();
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
