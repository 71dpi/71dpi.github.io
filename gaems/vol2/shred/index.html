<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SHRED</title>
  <meta name="theme-color" content="#FF4500">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF4500; --color-accent: #FFF200; }
    #game-screen { background: #FF4500; }

    #shred-area {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1rem 3rem;
      touch-action: none;
      overflow: hidden;
    }

    #doc-wrap {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    #doc {
      font-size: 7rem;
      line-height: 1;
      filter: drop-shadow(3px 3px 0 #000);
      transition: transform 0.1s;
    }

    #shredder {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #shredder-slot {
      width: 180px;
      height: 24px;
      background: #111;
      border: 4px solid #000;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #shredder-slot::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg, #222 0px, #222 8px, #333 8px, #333 16px
      );
    }

    #shredder-body {
      width: 200px;
      height: 80px;
      background: #333;
      border: 4px solid #000;
      border-top: none;
      border-radius: 0 0 16px 16px;
      box-shadow: 4px 4px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF200;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    #shred-strips {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      display: flex;
      gap: 3px;
      pointer-events: none;
    }

    .shred-strip {
      flex: 1;
      height: 0;
      background: white;
      border-radius: 2px;
      border: 1px solid #ccc;
      animation: strip-fall 0.6s ease forwards;
    }

    @keyframes strip-fall {
      0%   { height: 0; opacity: 1; transform: translateY(0); }
      60%  { height: 60px; opacity: 1; }
      100% { height: 60px; opacity: 0; transform: translateY(40px); }
    }

    #trail-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    #slot-indicator {
      position: absolute;
      bottom: 148px;
      left: 50%;
      transform: translateX(-50%);
      color: #FFF200;
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    #timer-bar-wrap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: rgba(0,0,0,0.3);
      z-index: 20;
    }
    #timer-bar {
      height: 100%;
      width: 100%;
      background: #FFF200;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">SHRED</h1>
    <div class="game-subject">📄</div>
    <p class="game-tagline">Drag the doc into the shredder!<br>Win: Destroy the evidence</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="shred-area">
      <canvas id="trail-canvas"></canvas>
      <div id="doc-wrap">
        <div id="doc">📄</div>
      </div>
      <div id="shredder">
        <div id="shredder-slot"></div>
        <div id="shredder-body">SHREDDER</div>
      </div>
      <div id="shred-strips"></div>
      <div id="slot-indicator">⬇ SLOT ⬇</div>
    </div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🗑️</div>
    <p class="game-tagline">Destroyed!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">📄</div>
    <p class="game-tagline">Evidence left!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'shred';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 8;

    function runTimer() {
      const e = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - e / TIME_LIMIT) * 100) + '%';
      if (e >= TIME_LIMIT) triggerLose();
      else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; show('lose'); }

    // ── SHRED GAME ──
    const docWrap = document.getElementById('doc-wrap');
    const shredSlot = document.getElementById('shredder-slot');
    const stripsEl = document.getElementById('shred-strips');
    const canvas = document.getElementById('trail-canvas');
    const ctx = canvas.getContext('2d');

    let dragging = false, dragOffX = 0, dragOffY = 0;
    let docX = 0, docY = 0;
    let trailPoints = [];
    let shredded = false;

    function resizeCanvas() {
      const area = document.getElementById('shred-area');
      canvas.width = area.offsetWidth;
      canvas.height = area.offsetHeight;
    }

    function getSlotCenter() {
      const r = shredSlot.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function getDocCenter() {
      const r = docWrap.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function drawTrail() {
      const area = document.getElementById('shred-area');
      const aRect = area.getBoundingClientRect();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (trailPoints.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 242, 0, 0.6)';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.moveTo(trailPoints[0].x - aRect.left, trailPoints[0].y - aRect.top);
      for (let i = 1; i < trailPoints.length; i++) {
        ctx.lineTo(trailPoints[i].x - aRect.left, trailPoints[i].y - aRect.top);
      }
      ctx.stroke();
    }

    function activateShredder() {
      if (shredded) return;
      shredded = true;
      docWrap.style.opacity = '0';
      stripsEl.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const s = document.createElement('div');
        s.className = 'shred-strip';
        s.style.animationDelay = (i * 0.03) + 's';
        stripsEl.appendChild(s);
      }
      triggerWin();
    }

    function onPointerDown(e) {
      if (!gameRunning || shredded) return;
      const touch = e.touches ? e.touches[0] : e;
      const r = docWrap.getBoundingClientRect();
      if (touch.clientX < r.left - 20 || touch.clientX > r.right + 20) return;
      if (touch.clientY < r.top - 20 || touch.clientY > r.bottom + 20) return;
      dragging = true;
      dragOffX = touch.clientX - (r.left + r.width / 2);
      dragOffY = touch.clientY - (r.top + r.height / 2);
      trailPoints = [{ x: touch.clientX, y: touch.clientY }];
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!dragging || !gameRunning || shredded) return;
      const touch = e.touches ? e.touches[0] : e;
      const cx = touch.clientX - dragOffX;
      const cy = touch.clientY - dragOffY;
      docWrap.style.left = cx + 'px';
      docWrap.style.top = cy + 'px';
      docWrap.style.transform = 'none';
      trailPoints.push({ x: touch.clientX, y: touch.clientY });
      if (trailPoints.length > 30) trailPoints.shift();
      drawTrail();

      const slot = getSlotCenter();
      const doc = getDocCenter();
      if (dist(doc, slot) < 40) {
        activateShredder();
      }
      e.preventDefault();
    }

    function onPointerUp() {
      dragging = false;
    }

    function startGame() {
      shredded = false;
      dragging = false;
      trailPoints = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stripsEl.innerHTML = '';
      docWrap.style.opacity = '1';
      docWrap.style.left = '50%';
      docWrap.style.top = '60px';
      docWrap.style.transform = 'translateX(-50%)';
      resizeCanvas();
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
    }

    const area = document.getElementById('shred-area');
    area.addEventListener('touchstart', onPointerDown, { passive: false });
    area.addEventListener('touchmove', onPointerMove, { passive: false });
    area.addEventListener('touchend', onPointerUp);
    area.addEventListener('mousedown', onPointerDown);
    area.addEventListener('mousemove', onPointerMove);
    area.addEventListener('mouseup', onPointerUp);

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
