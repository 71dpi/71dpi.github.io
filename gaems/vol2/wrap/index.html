<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WRAP</title>
  <meta name="theme-color" content="#E53935">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FFEBEE; --color-accent: #B71C1C; }
    #game-area { position:relative; width:min(300px,85vw); height:min(300px,85vw); margin:0 auto; }
    #gift-svg { width:100%; height:100%; touch-action:none; }
    #timer-bar-wrap { width:min(300px,85vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #wrap-label { font-weight:900; font-size:1.1rem; letter-spacing:0.05em; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">WRAP</h1>
    <div class="game-subject">🎁</div>
    <p class="game-tagline">Tap the four corners to wrap the gift<br>Tap them in order: ↖ ↗ ↘ ↙</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <svg id="gift-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Gift box body -->
        <rect x="40" y="100" width="220" height="170" rx="8" fill="#E53935" stroke="#000" stroke-width="4"/>
        <!-- Ribbon horizontal -->
        <rect x="40" y="170" width="220" height="20" fill="#FFD600" stroke="#000" stroke-width="2"/>
        <!-- Ribbon vertical -->
        <rect x="135" y="100" width="30" height="170" fill="#FFD600" stroke="#000" stroke-width="2"/>
        <!-- Gift lid -->
        <rect x="30" y="78" width="240" height="32" rx="8" fill="#C62828" stroke="#000" stroke-width="4"/>
        <!-- Bow -->
        <ellipse cx="150" cy="78" rx="30" ry="16" fill="#FFD600" stroke="#000" stroke-width="3"/>
        <ellipse cx="150" cy="78" rx="16" ry="30" fill="#FFD600" stroke="#000" stroke-width="3"/>
        <circle cx="150" cy="78" r="10" fill="#FFEE58" stroke="#000" stroke-width="2"/>
        <!-- Paper flaps (corners to tap) -->
        <polygon id="corner-tl" points="40,100 40,40 100,100" fill="#FFCDD2" stroke="#000" stroke-width="3" opacity="0.9"/>
        <polygon id="corner-tr" points="260,100 260,40 200,100" fill="#FFCDD2" stroke="#000" stroke-width="3" opacity="0.9"/>
        <polygon id="corner-br" points="260,270 260,300 200,270" fill="#FFCDD2" stroke="#000" stroke-width="3" opacity="0.9"/>
        <polygon id="corner-bl" points="40,270 40,300 100,270" fill="#FFCDD2" stroke="#000" stroke-width="3" opacity="0.9"/>
        <!-- Corner labels -->
        <text id="lbl-tl" x="58" y="82" fill="#B71C1C" font-size="20" font-weight="900" font-family="Inter,sans-serif">1</text>
        <text id="lbl-tr" x="230" y="82" fill="#B71C1C" font-size="20" font-weight="900" font-family="Inter,sans-serif">2</text>
        <text id="lbl-br" x="230" y="298" fill="#B71C1C" font-size="20" font-weight="900" font-family="Inter,sans-serif">3</text>
        <text id="lbl-bl" x="55" y="298" fill="#B71C1C" font-size="20" font-weight="900" font-family="Inter,sans-serif">4</text>
        <!-- Check marks (hidden) -->
        <text id="chk-tl" x="58" y="82" fill="#00C853" font-size="20" font-weight="900" font-family="Inter,sans-serif" opacity="0">✓</text>
        <text id="chk-tr" x="230" y="82" fill="#00C853" font-size="20" font-weight="900" font-family="Inter,sans-serif" opacity="0">✓</text>
        <text id="chk-br" x="230" y="298" fill="#00C853" font-size="20" font-weight="900" font-family="Inter,sans-serif" opacity="0">✓</text>
        <text id="chk-bl" x="55" y="298" fill="#00C853" font-size="20" font-weight="900" font-family="Inter,sans-serif" opacity="0">✓</text>
      </svg>
    </div>
    <p id="wrap-label">TAP CORNER 1!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🎁</div>
    <p class="game-tagline">Beautifully wrapped!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">TIME'S UP!</p>
    <div class="game-subject anim-shake">🎁</div>
    <p class="game-tagline">Gift unwrapped!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='wrap', TIME_LIMIT=8;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, step=0;
    const label=document.getElementById('wrap-label');
    const corners=['tl','tr','br','bl'];
    const CORNER_LABELS=['TAP CORNER 1!','TAP CORNER 2!','TAP CORNER 3!','TAP CORNER 4!'];

    function highlight(idx){
      corners.forEach((c,i)=>{
        const el=document.getElementById('corner-'+c);
        if(el) el.setAttribute('fill',i===idx?'#FFD600':'#FFCDD2');
      });
    }

    function resetCorners(){
      corners.forEach(c=>{
        document.getElementById('corner-'+c).setAttribute('fill','#FFCDD2');
        document.getElementById('corner-'+c).setAttribute('opacity','0.9');
        document.getElementById('lbl-'+c).setAttribute('opacity','1');
        document.getElementById('chk-'+c).setAttribute('opacity','0');
      });
    }

    const gameArea=document.getElementById('game-area');
    const SVG_W=300, SVG_H=300;
    const CORNER_ZONES=[
      {x1:0,y1:0,x2:110,y2:110,idx:0},     // TL
      {x1:190,y1:0,x2:300,y2:110,idx:1},    // TR
      {x1:190,y1:190,x2:300,y2:300,idx:2},  // BR
      {x1:0,y1:190,x2:110,y2:300,idx:3},    // BL
    ];

    function getSVGPos(clientX, clientY){
      const rect=gameArea.getBoundingClientRect();
      return {x:clientX/rect.width*SVG_W, y:clientY/rect.height*SVG_H};
    }
    function handleTap(clientX, clientY){
      if(!gameRunning)return;
      const p=getSVGPos(clientX,clientY);
      const zone=CORNER_ZONES.find(z=>p.x>=z.x1&&p.x<=z.x2&&p.y>=z.y1&&p.y<=z.y2);
      if(!zone)return;
      if(zone.idx===step){
        const c=corners[step];
        document.getElementById('corner-'+c).setAttribute('fill','#A5D6A7');
        document.getElementById('lbl-'+c).setAttribute('opacity','0');
        document.getElementById('chk-'+c).setAttribute('opacity','1');
        step++;
        if(step>=4){triggerWin();return;}
        label.textContent=CORNER_LABELS[step];
        highlight(step);
      } else {
        // wrong corner — small penalty visual
        gameArea.style.outline='4px solid #F44336';
        setTimeout(()=>{gameArea.style.outline='none';},300);
      }
    }
    gameArea.addEventListener('click',e=>handleTap(e.clientX,e.clientY));
    gameArea.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];handleTap(t.clientX,t.clientY);},{passive:false});

    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;cancelAnimationFrame(timerRAF);setTimeout(()=>show('win'),400);}
    function triggerLose(){gameRunning=false;show('lose');}
    function startGame(){
      step=0;resetCorners();highlight(0);
      label.textContent=CORNER_LABELS[0];
      show('game');gameRunning=true;timerStart=Date.now();timerRAF=requestAnimationFrame(runTimer);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
