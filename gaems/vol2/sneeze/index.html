<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SNEEZE</title>
  <meta name="theme-color" content="#FF3EDB">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF3EDB; --color-accent: #FFF200; }

    #game-screen { touch-action: none; overflow: hidden; }

    #game-area {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12%;
    }

    #face {
      font-size: 7rem;
      line-height: 1;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    #nose-dot {
      position: absolute;
      width: 16px; height: 16px;
      background: #000;
      border-radius: 50%;
      top: 52%;
      left: 50%;
      transform: translateX(-50%);
    }

    #finger {
      position: absolute;
      font-size: 3rem;
      line-height: 1;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%) rotate(180deg);
      pointer-events: none;
      transition: bottom 0.05s linear;
      z-index: 2;
    }

    #tap-hint {
      position: absolute;
      bottom: 8%;
      font-size: 1.1rem;
      font-weight: 800;
      color: #000;
      text-align: center;
    }

    #tap-count {
      position: absolute;
      top: 10%;
      right: 1.5rem;
      font-size: 1.4rem;
      font-weight: 900;
      color: rgba(0,0,0,0.5);
    }

    #timer-bar-wrap { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: rgba(0,0,0,0.15); }
    #timer-bar { height: 100%; background: var(--color-accent); }
  </style>
</head>
<body>
  <!-- START SCREEN -->
  <div id="start-screen" class="screen">
    <h1 class="game-title">SNEEZE</h1>
    <!-- TO REPLACE: <img src="art/subject.svg"> -->
    <div class="game-subject">🤧</div>
    <p class="game-tagline">TAP rapidly to push the finger away from your nose!<br>Win: Sneeze suppressed!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <div id="face">😐</div>
      <div id="finger">👆</div>
      <div id="tap-hint">TAP anywhere to push away!</div>
      <div id="tap-count">👆 0</div>
    </div>
  </div>

  <!-- WIN SCREEN -->
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">😤</div>
    <p class="game-tagline">Sneeze suppressed!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <!-- LOSE SCREEN -->
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">🤧</div>
    <p class="game-tagline">ACHOO!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'sneeze';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 8;

    function runTimer() {
      const elapsed = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - elapsed / TIME_LIMIT) * 100) + '%';
      if (elapsed >= TIME_LIMIT) { triggerWin(); return; } // survived = win
      if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin()  { gameRunning = false; cancelAnimationFrame(timerRAF); cancelAnimationFrame(creepRAF); setTimeout(() => show('win'), 150); }
    function triggerLose() { gameRunning = false; cancelAnimationFrame(timerRAF); cancelAnimationFrame(creepRAF); show('lose'); }

    const finger = document.getElementById('finger');
    const face = document.getElementById('face');
    const tapCountEl = document.getElementById('tap-count');
    let fingerBottom = 20; // percent from bottom
    let tapCount = 0;
    let creepRAF;
    const CREEP_RATE = 0.035; // % per frame
    // nose is roughly at 52% from top, which is 48% from bottom of face, then face is at 12% from top
    // Simplify: "lose" when fingerBottom exceeds 62%
    const LOSE_THRESHOLD = 64;

    function creepFrame() {
      if (!gameRunning) return;
      fingerBottom += CREEP_RATE;
      finger.style.bottom = fingerBottom + '%';
      if (fingerBottom >= LOSE_THRESHOLD) {
        face.textContent = '🤧';
        triggerLose();
        return;
      }
      creepRAF = requestAnimationFrame(creepFrame);
    }

    function onTap(e) {
      if (!gameRunning) return;
      e.preventDefault();
      tapCount++;
      tapCountEl.textContent = `👆 ${tapCount}`;
      fingerBottom -= 3.5;
      if (fingerBottom < 18) fingerBottom = 18;
      finger.style.bottom = fingerBottom + '%';
      // flash finger
      finger.style.filter = 'brightness(2)';
      setTimeout(() => { finger.style.filter = ''; }, 80);
    }

    document.getElementById('game-screen').addEventListener('touchstart', onTap, { passive: false });
    document.getElementById('game-screen').addEventListener('mousedown', onTap);

    function startGame() {
      show('game');
      gameRunning = true;
      fingerBottom = 20;
      tapCount = 0;
      face.textContent = '😐';
      tapCountEl.textContent = '👆 0';
      finger.style.bottom = fingerBottom + '%';
      finger.style.filter = '';

      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      creepRAF = requestAnimationFrame(creepFrame);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
