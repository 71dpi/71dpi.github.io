<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LAUNCH</title>
  <meta name="theme-color" content="#0D1B4B">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #0D1B4B; --color-accent: #FF6B00; --color-ink: #ffffff; }
    body { background: var(--color-bg); color:#fff; }
    .screen { background: var(--color-bg); }
    .game-title, .game-tagline, .result-label { color: #fff; }
    .btn { color: #000; }
    .btn-icon { background:#fff; }
    #game-area { position:relative; width:min(280px,80vw); height:min(300px,85vw); margin:0 auto; cursor:pointer; }
    #launch-svg { width:100%; height:100%; }
    #timer-bar-wrap { width:min(280px,80vw); height:14px; background:#333; border:var(--stroke) solid #fff; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #launch-label { font-weight:900; font-size:1.2rem; color:#fff; letter-spacing:0.05em; text-align:center; }
    #countdown-display { font-size:clamp(3rem,18vw,6rem); font-weight:900; color:#FF6B00; text-align:center; line-height:1; min-height:5rem; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">LAUNCH</h1>
    <div class="game-subject">🚀</div>
    <p class="game-tagline">Tap exactly at countdown zero!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="countdown-display"> </div>
    <div id="game-area">
      <svg id="launch-svg" viewBox="0 0 280 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="0" y="0" width="280" height="300" fill="#0D1B4B"/>
        <circle cx="30" cy="25" r="2" fill="white" opacity="0.8"/>
        <circle cx="80" cy="10" r="1.5" fill="white" opacity="0.6"/>
        <circle cx="130" cy="30" r="2" fill="white" opacity="0.7"/>
        <circle cx="200" cy="15" r="1.5" fill="white" opacity="0.5"/>
        <circle cx="250" cy="35" r="2" fill="white" opacity="0.8"/>
        <circle cx="50" cy="60" r="1.5" fill="white" opacity="0.4"/>
        <circle cx="220" cy="55" r="1" fill="white" opacity="0.6"/>
        <!-- Launch pad -->
        <rect x="80" y="250" width="120" height="35" rx="4" fill="#424242" stroke="#fff" stroke-width="2"/>
        <rect x="100" y="238" width="80" height="18" rx="3" fill="#616161" stroke="#fff" stroke-width="2"/>
        <!-- Rocket -->
        <g id="rocket" transform="translate(140,150)">
          <polygon points="0,-55 -18,8 18,8" fill="#EF5350" stroke="#fff" stroke-width="2"/>
          <rect x="-18" y="8" width="36" height="44" rx="4" fill="#E0E0E0" stroke="#fff" stroke-width="2"/>
          <circle cx="0" cy="22" r="9" fill="#29B6F6" stroke="#fff" stroke-width="2"/>
          <polygon points="-18,36 -34,56 -18,56" fill="#EF5350" stroke="#fff" stroke-width="2"/>
          <polygon points="18,36 34,56 18,56" fill="#EF5350" stroke="#fff" stroke-width="2"/>
          <g id="rocket-flame" opacity="0">
            <ellipse cx="0" cy="56" rx="10" ry="18" fill="#FF6B00"/>
            <ellipse cx="0" cy="60" rx="6" ry="12" fill="#FFD600"/>
          </g>
        </g>
        <!-- Countdown ring -->
        <circle id="count-ring" cx="140" cy="150" r="88" fill="none" stroke="#FF6B00" stroke-width="5" stroke-dasharray="0 553" transform="rotate(-90,140,150)" opacity="0.8"/>
        <circle cx="140" cy="150" r="88" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5"/>
      </svg>
    </div>
    <p id="launch-label">GET READY...</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">LAUNCH!</p>
    <div class="game-subject anim-bounce">🚀</div>
    <p class="game-tagline" style="color:#fff">Perfect timing!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">ABORT!</p>
    <div class="game-subject anim-shake">🚀</div>
    <p class="game-tagline" style="color:#fff">Wrong timing!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='launch', TIME_LIMIT=9, COUNTDOWN=5, WIN_WINDOW=0.7;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, countStart=0, tapped=false, phase='wait';
    const label=document.getElementById('launch-label'), countDisplay=document.getElementById('countdown-display');
    const ring=document.getElementById('count-ring'), flame=document.getElementById('rocket-flame');
    const CIRC=2*Math.PI*88;

    function handleTap(){
      if(!gameRunning||tapped)return;
      tapped=true;
      if(phase!=='counting'){triggerLose();return;}
      const elapsed=(Date.now()-countStart)/1000;
      const remaining=COUNTDOWN-elapsed;
      if(remaining<=WIN_WINDOW&&remaining>=-0.2){triggerWin();}
      else{triggerLose();}
    }
    document.getElementById('game-area').addEventListener('click',handleTap);
    document.getElementById('game-area').addEventListener('touchend',e=>{e.preventDefault();handleTap();},{passive:false});

    let animRAF=0;
    function animLoop(){
      if(!gameRunning)return;
      if(phase==='counting'){
        const elapsed=(Date.now()-countStart)/1000;
        const remaining=Math.max(0,COUNTDOWN-elapsed);
        ring.setAttribute('stroke-dasharray',(1-remaining/COUNTDOWN)*CIRC+' '+CIRC);
        const secs=Math.ceil(remaining);
        countDisplay.textContent=remaining<=0?'0':secs;
        label.textContent=remaining<=WIN_WINDOW?'TAP NOW!':'TAP AT ZERO!';
        if(remaining<=0&&!tapped){triggerLose();return;}
      }
      if(gameRunning)animRAF=requestAnimationFrame(animLoop);
    }
    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;cancelAnimationFrame(timerRAF);cancelAnimationFrame(animRAF);flame.setAttribute('opacity','1');setTimeout(()=>show('win'),500);}
    function triggerLose(){gameRunning=false;cancelAnimationFrame(animRAF);countDisplay.textContent=' ';show('lose');}
    function startGame(){
      tapped=false;phase='wait';ring.setAttribute('stroke-dasharray','0 '+CIRC);
      flame.setAttribute('opacity',0);countDisplay.textContent=' ';
      label.textContent='GET READY...';
      show('game');gameRunning=true;timerStart=Date.now();timerRAF=requestAnimationFrame(runTimer);
      const wait=1200+Math.random()*1500;
      setTimeout(()=>{if(gameRunning){phase='counting';countStart=Date.now();animRAF=requestAnimationFrame(animLoop);}},wait);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
