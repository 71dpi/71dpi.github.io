<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TYPE</title>
  <meta name="theme-color" content="#7CFF00">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #7CFF00; --color-accent: #FF6B00; }
    #game-screen { background: #7CFF00; }

    #type-area {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 1.5rem;
    }

    #target-letters {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .target-letter {
      width: 72px; height: 72px;
      border: 4px solid #000;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 4px 4px 0 #000;
      transition: background 0.2s;
    }

    .target-letter.done {
      background: #00D66B;
      color: #fff;
    }

    .target-letter.active {
      background: #FFF200;
      animation: pulse 0.5s ease infinite;
    }

    #keyboard-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 360px;
    }

    .key-btn {
      width: 72px; height: 72px;
      border: 4px solid #000;
      border-radius: 12px;
      background: #fff;
      font-size: 2rem;
      font-weight: 900;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, box-shadow 0.1s;
      font-family: var(--font);
    }

    .key-btn:active {
      transform: translate(3px,3px);
      box-shadow: 1px 1px 0 #000;
    }

    .key-btn.wrong {
      background: #FF3232;
      color: #fff;
      animation: shake 0.3s ease;
    }

    #hud {
      font-weight: 900;
      font-size: 1.2rem;
      color: #000;
    }

    #timer-bar-wrap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: rgba(0,0,0,0.2);
      z-index: 20;
    }
    #timer-bar { height: 100%; width: 100%; background: #FF6B00; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">TYPE</h1>
    <div class="game-subject">⌨️</div>
    <p class="game-tagline">Tap the 3 letters in order!<br>Win: Sent!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="type-area">
      <div id="hud">Tap in order!</div>
      <div id="target-letters"></div>
      <div id="keyboard-row"></div>
    </div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">✅</div>
    <p class="game-tagline">Sent!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">❌</div>
    <p class="game-tagline">Wrong key!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'type';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 8;

    function runTimer() {
      const e = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - e / TIME_LIMIT) * 100) + '%';
      if (e >= TIME_LIMIT) triggerLose();
      else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; show('lose'); }

    // ── TYPE GAME ──
    const targetEl = document.getElementById('target-letters');
    const keyboardEl = document.getElementById('keyboard-row');
    const hud = document.getElementById('hud');

    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let targetLetters = [];
    let currentIdx = 0;
    let targetDivs = [];

    function pickLetters() {
      const picked = [];
      const pool = ALPHABET.split('');
      while (picked.length < 3) {
        const idx = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(idx, 1)[0]);
      }
      return picked;
    }

    function pickDecoys(targets) {
      const pool = ALPHABET.split('').filter(l => !targets.includes(l));
      const decoys = [];
      while (decoys.length < 3) {
        const idx = Math.floor(Math.random() * pool.length);
        decoys.push(pool.splice(idx, 1)[0]);
      }
      return decoys;
    }

    function fisherYates(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildUI() {
      targetLetters = pickLetters();
      currentIdx = 0;
      targetEl.innerHTML = '';
      targetDivs = [];
      targetLetters.forEach((l, i) => {
        const d = document.createElement('div');
        d.className = 'target-letter' + (i === 0 ? ' active' : '');
        d.textContent = l;
        targetEl.appendChild(d);
        targetDivs.push(d);
      });

      const decoys = pickDecoys(targetLetters);
      const allKeys = fisherYates([...targetLetters, ...decoys]);
      keyboardEl.innerHTML = '';
      allKeys.forEach(l => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = l;
        btn.addEventListener('click', () => onKeyPress(l, btn));
        btn.addEventListener('touchend', e => { e.preventDefault(); onKeyPress(l, btn); }, { passive: false });
        keyboardEl.appendChild(btn);
      });
    }

    function onKeyPress(letter, btn) {
      if (!gameRunning) return;
      if (letter === targetLetters[currentIdx]) {
        targetDivs[currentIdx].classList.remove('active');
        targetDivs[currentIdx].classList.add('done');
        currentIdx++;
        if (currentIdx < targetLetters.length) {
          targetDivs[currentIdx].classList.add('active');
        } else {
          triggerWin();
        }
      } else {
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 400);
        triggerLose();
      }
    }

    function startGame() {
      buildUI();
      hud.textContent = 'Tap in order!';
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
