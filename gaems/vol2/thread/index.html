<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>THREAD</title>
  <meta name="theme-color" content="#FF6B00">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF6B00; --color-accent: #00D4FF; }

    #game-screen { touch-action: none; overflow: hidden; }

    #game-area {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Needle: tall thin rect in center */
    #needle {
      position: absolute;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      width: 14px;
      height: 75%;
      background: #222;
      border-radius: 4px 4px 8px 8px;
      z-index: 2;
      pointer-events: none;
    }

    /* The eye — a gap in the needle */
    #needle-eye {
      position: absolute;
      left: 50%;
      width: 28px;
      height: 28px;
      background: var(--color-bg);
      border: 3px solid #444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
      /* top is set by JS */
    }

    /* Thread line from corner to tip */
    #thread-line {
      position: absolute;
      left: 0; top: 0;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    #thread-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #thread-path {
      stroke: #00AAFF;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
    }

    #thread-tip {
      position: absolute;
      width: 36px; height: 36px;
      background: #fff;
      border: 4px solid #000;
      border-radius: 50%;
      cursor: grab;
      touch-action: none;
      box-shadow: 2px 2px 0 #000;
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
    }

    #thread-tip.threaded { background: #7CFF00; border-color: #000; }

    #hint {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      font-weight: 800;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
    }

    #timer-bar-wrap { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: rgba(0,0,0,0.2); }
    #timer-bar { height: 100%; background: var(--color-accent); }
  </style>
</head>
<body>
  <!-- START SCREEN -->
  <div id="start-screen" class="screen">
    <h1 class="game-title">THREAD</h1>
    <!-- TO REPLACE: <img src="art/subject.svg"> -->
    <div class="game-subject">🧵</div>
    <p class="game-tagline">Drag the thread tip through the needle eye as it moves!<br>Win: Threaded!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <div id="needle"><div id="needle-eye"></div></div>
      <svg id="thread-svg"><line id="thread-path" x1="0" y1="0" x2="0" y2="0"/></svg>
      <div id="thread-tip">🧵</div>
      <div id="hint">Drag tip through the hole ○</div>
    </div>
  </div>

  <!-- WIN SCREEN -->
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">✅</div>
    <p class="game-tagline">Threaded!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <!-- LOSE SCREEN -->
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">🧵</div>
    <p class="game-tagline">Missed!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'thread';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 9;

    function runTimer() {
      const elapsed = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - elapsed / TIME_LIMIT) * 100) + '%';
      if (elapsed >= TIME_LIMIT) { triggerLose(); return; }
      if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin()  { gameRunning = false; cancelAnimationFrame(timerRAF); cancelAnimationFrame(eyeRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; cancelAnimationFrame(eyeRAF); show('lose'); }

    const needle    = document.getElementById('needle');
    const needleEye = document.getElementById('needle-eye');
    const threadTip = document.getElementById('thread-tip');
    const threadPath = document.getElementById('thread-path');
    const gameArea  = document.getElementById('game-area');

    let tipX = 60, tipY = 80; // percent of area
    let eyePercent = 50; // 15-85 along needle height
    let eyeDir = 1;
    let eyeRAF;
    let lastEyeTime = 0;
    let dragging = false;

    function getEyePos() {
      const nRect = needle.getBoundingClientRect();
      const aRect = gameArea.getBoundingClientRect();
      const eyeY = nRect.top + (nRect.height * eyePercent / 100) - aRect.top;
      const eyeX = nRect.left + nRect.width / 2 - aRect.left;
      return { x: eyeX, y: eyeY };
    }

    function animateEye(ts) {
      if (!gameRunning) return;
      const dt = lastEyeTime ? (ts - lastEyeTime) / 1000 : 0.016;
      lastEyeTime = ts;
      eyePercent += eyeDir * dt * 18;
      if (eyePercent > 80) { eyePercent = 80; eyeDir = -1; }
      if (eyePercent < 20) { eyePercent = 20; eyeDir = 1; }
      needleEye.style.top = eyePercent + '%';

      // update thread line
      const aRect = gameArea.getBoundingClientRect();
      const anchorX = 30;
      const anchorY = aRect.height * 0.85;
      const tx = aRect.width * tipX / 100;
      const ty = aRect.height * tipY / 100;
      threadPath.setAttribute('x1', anchorX);
      threadPath.setAttribute('y1', anchorY);
      threadPath.setAttribute('x2', tx);
      threadPath.setAttribute('y2', ty);

      // check if tip is in needle eye
      const ep = getEyePos();
      const tipAbsX = aRect.left + tx;
      const tipAbsY = aRect.top + ty;
      const eyeAbsX = aRect.left + ep.x;
      const eyeAbsY = aRect.top + ep.y;
      const nRect = needle.getBoundingClientRect();
      const onNeedleX = Math.abs(tipAbsX - (nRect.left + nRect.width / 2)) < 20;
      const inEyeY = Math.abs(tipAbsY - eyeAbsY) < 18;

      if (onNeedleX && inEyeY) {
        threadTip.classList.add('threaded');
        triggerWin();
        return;
      } else {
        threadTip.classList.remove('threaded');
      }

      eyeRAF = requestAnimationFrame(animateEye);
    }

    function onDragStart(e) {
      if (!gameRunning) return;
      const pt = e.touches ? e.touches[0] : e;
      const tRect = threadTip.getBoundingClientRect();
      const tipCX = tRect.left + tRect.width / 2;
      const tipCY = tRect.top + tRect.height / 2;
      if (Math.hypot(pt.clientX - tipCX, pt.clientY - tipCY) < 40) {
        dragging = true;
        e.preventDefault();
      }
    }
    function onDragMove(e) {
      if (!dragging || !gameRunning) return;
      e.preventDefault();
      const pt = e.touches ? e.touches[0] : e;
      const aRect = gameArea.getBoundingClientRect();
      tipX = ((pt.clientX - aRect.left) / aRect.width) * 100;
      tipY = ((pt.clientY - aRect.top) / aRect.height) * 100;
      tipX = Math.max(2, Math.min(98, tipX));
      tipY = Math.max(2, Math.min(98, tipY));
      threadTip.style.left = `calc(${tipX}% - 18px)`;
      threadTip.style.top  = `calc(${tipY}% - 18px)`;
    }
    function onDragEnd() { dragging = false; }

    const gs = document.getElementById('game-screen');
    gs.addEventListener('touchstart', onDragStart, { passive: false });
    gs.addEventListener('touchmove', onDragMove, { passive: false });
    gs.addEventListener('touchend', onDragEnd);
    gs.addEventListener('mousedown', onDragStart);
    gs.addEventListener('mousemove', onDragMove);
    gs.addEventListener('mouseup', onDragEnd);

    function startGame() {
      show('game');
      gameRunning = true;
      dragging = false;
      lastEyeTime = 0;
      eyePercent = 50;
      eyeDir = 1;
      tipX = 75; tipY = 80;
      threadTip.style.left = `calc(${tipX}% - 18px)`;
      threadTip.style.top  = `calc(${tipY}% - 18px)`;
      threadTip.classList.remove('threaded');
      needleEye.style.top = '50%';

      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      eyeRAF = requestAnimationFrame(animateEye);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
