<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>CLOG</title>
  <meta name="theme-color" content="#FFB800">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FFB800; --color-accent: #FF6B00; }
    #game-screen { background: #FFB800; }

    #clog-area {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    #meter-wrap {
      width: 220px;
      height: 32px;
      background: #fff;
      border: 4px solid #000;
      border-radius: 16px;
      box-shadow: 4px 4px 0 #000;
      overflow: hidden;
      position: relative;
    }

    #clog-meter {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00D66B, #FFD700, #FF3232);
      background-size: 220px;
      background-position: right;
      transition: width 0.15s ease;
      border-radius: 12px;
    }

    #meter-label {
      font-weight: 900;
      font-size: 1.1rem;
      color: #000;
      text-align: center;
    }

    #toilet-emoji {
      font-size: 8rem;
      line-height: 1;
      filter: drop-shadow(4px 4px 0 #000);
      pointer-events: none;
      user-select: none;
    }

    #plunger-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #FF6B00;
      border: 6px solid #000;
      box-shadow: 6px 6px 0 #000;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      font-size: 3.5rem;
      transition: transform 0.1s, box-shadow 0.1s;
      touch-action: manipulation;
      user-select: none;
    }

    #plunger-btn:active, #plunger-btn.pressed {
      transform: translate(4px, 4px) scaleY(0.88);
      box-shadow: 2px 2px 0 #000;
    }

    #plunger-btn span {
      font-size: 0.75rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.05em;
    }

    #tap-count {
      font-weight: 900;
      font-size: 1rem;
      color: #000;
    }

    #timer-bar-wrap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: rgba(0,0,0,0.2);
      z-index: 20;
    }
    #timer-bar { height: 100%; width: 100%; background: #FF6B00; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">CLOG</h1>
    <div class="game-subject">🚽</div>
    <p class="game-tagline">Tap the plunger 10 times!<br>Win: Clear!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="clog-area">
      <div id="meter-label">CLOG 100%</div>
      <div id="meter-wrap">
        <div id="clog-meter" style="width:100%"></div>
      </div>
      <div id="toilet-emoji">🚽</div>
      <button id="plunger-btn" aria-label="Plunge">
        🪠
        <span>TAP!</span>
      </button>
      <div id="tap-count">0 / 10</div>
    </div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">💧</div>
    <p class="game-tagline">Clear!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">🚽</div>
    <p class="game-tagline">Still clogged!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'clog';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 8;

    function runTimer() {
      const e = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - e / TIME_LIMIT) * 100) + '%';
      if (e >= TIME_LIMIT) triggerLose();
      else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; show('lose'); }

    // ── CLOG GAME ──
    const meterBar = document.getElementById('clog-meter');
    const meterLabel = document.getElementById('meter-label');
    const plungerBtn = document.getElementById('plunger-btn');
    const tapCountEl = document.getElementById('tap-count');
    const TAPS_NEEDED = 10;
    let taps = 0;

    function plunge() {
      if (!gameRunning) return;
      taps++;
      const pct = Math.max(0, 100 - taps * 10);
      meterBar.style.width = pct + '%';
      meterLabel.textContent = `CLOG ${pct}%`;
      tapCountEl.textContent = `${taps} / ${TAPS_NEEDED}`;

      // Press animation
      plungerBtn.classList.add('pressed');
      setTimeout(() => plungerBtn.classList.remove('pressed'), 120);

      if (taps >= TAPS_NEEDED) triggerWin();
    }

    plungerBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      plunge();
    }, { passive: false });

    plungerBtn.addEventListener('mousedown', e => {
      e.preventDefault();
      plunge();
    });

    function startGame() {
      taps = 0;
      meterBar.style.width = '100%';
      meterLabel.textContent = 'CLOG 100%';
      tapCountEl.textContent = `0 / ${TAPS_NEEDED}`;
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
