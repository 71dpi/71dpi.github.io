<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DIG</title>
  <meta name="theme-color" content="#F4C430">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #F4C430; --color-accent: #8B4513; }
    #game-area { position:relative; width:min(300px,85vw); height:min(300px,85vw); margin:0 auto; }
    #dig-canvas { display:block; border:var(--stroke) solid #000; border-radius:12px; box-shadow:var(--shadow); touch-action:none; cursor:crosshair; }
    #timer-bar-wrap { width:min(300px,85vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #dig-label { font-weight:900; font-size:1.1rem; letter-spacing:0.05em; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">DIG</h1>
    <div class="game-subject">🏖️</div>
    <p class="game-tagline">Swipe the sand to find the buried treasure</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <canvas id="dig-canvas" width="300" height="300"></canvas>
    </div>
    <p id="dig-label">SWIPE TO DIG!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🏆</div>
    <p class="game-tagline">Treasure found!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">TIME'S UP!</p>
    <div class="game-subject anim-shake">🏖️</div>
    <p class="game-tagline">Still buried!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='dig', TIME_LIMIT=8;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0;
    const canvas=document.getElementById('dig-canvas'), ctx=canvas.getContext('2d');
    const W=300, H=300, BRUSH=28;
    let treasureX, treasureY, revealed=false, totalPixels, clearedPixels=0;

    function initCanvas() {
      // Draw treasure below
      ctx.clearRect(0,0,W,H);
      // Treasure chest background
      ctx.fillStyle='#F4C430';
      ctx.fillRect(0,0,W,H);
      // Draw treasure
      treasureX=80+Math.random()*(W-160); treasureY=80+Math.random()*(H-160);
      ctx.font='64px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏆', treasureX, treasureY);
      // Sand overlay using destination-out later; start with sand drawn on top
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#C8A020';
      ctx.fillRect(0,0,W,H);
      // Add sand texture
      for (let i=0;i<400;i++){
        ctx.fillStyle='rgba(255,200,50,'+(0.3+Math.random()*0.3)+')';
        const sx=Math.random()*W, sy=Math.random()*H;
        ctx.fillRect(sx,sy,2+Math.random()*4,1+Math.random()*2);
      }
      ctx.globalCompositeOperation='source-over';
      totalPixels=W*H; clearedPixels=0; revealed=false;
    }

    function dig(cx, cy) {
      ctx.globalCompositeOperation='destination-out';
      ctx.beginPath(); ctx.arc(cx,cy,BRUSH,0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation='source-over';
      // Check if treasure area is revealed
      const dx=cx-treasureX, dy=cy-treasureY;
      if (!revealed && Math.hypot(dx,dy)<BRUSH+20) { revealed=true; triggerWin(); }
    }

    function getPos(e, touch) {
      const rect=canvas.getBoundingClientRect();
      const scaleX=W/rect.width, scaleY=H/rect.height;
      return {x:(touch.clientX-rect.left)*scaleX, y:(touch.clientY-rect.top)*scaleY};
    }
    let lastPos=null;
    canvas.addEventListener('touchstart',e=>{if(!gameRunning)return;e.preventDefault();const p=getPos(e,e.changedTouches[0]);lastPos=p;dig(p.x,p.y);},{passive:false});
    canvas.addEventListener('touchmove',e=>{if(!gameRunning)return;e.preventDefault();const p=getPos(e,e.changedTouches[0]);dig(p.x,p.y);lastPos=p;},{passive:false});
    canvas.addEventListener('touchend',()=>{lastPos=null;});
    let mouseDown2=false;
    canvas.addEventListener('mousedown',e=>{if(!gameRunning)return;mouseDown2=true;const p=getPos(e,e);dig(p.x,p.y);});
    canvas.addEventListener('mousemove',e=>{if(!gameRunning||!mouseDown2)return;const p=getPos(e,e);dig(p.x,p.y);});
    canvas.addEventListener('mouseup',()=>{mouseDown2=false;});

    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;cancelAnimationFrame(timerRAF);setTimeout(()=>show('win'),500);}
    function triggerLose(){gameRunning=false;show('lose');}
    function startGame(){
      revealed=false;initCanvas();
      show('game');gameRunning=true;timerStart=Date.now();timerRAF=requestAnimationFrame(runTimer);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
