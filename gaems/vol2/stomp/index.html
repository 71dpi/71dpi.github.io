<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>STOMP</title>
  <meta name="theme-color" content="#FF3EDB">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF3EDB; --color-accent: #FFF200; }

    #game-screen { overflow: hidden; touch-action: manipulation; }

    #game-area {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #roach {
      position: absolute;
      font-size: 3.5rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      top: 50%;
      left: -60px;
      transform: translateY(-50%);
      transition: transform 0.1s;
    }

    #roach.crawling {
      animation: crawl var(--crawl-dur) linear forwards;
    }

    @keyframes crawl {
      from { left: -60px; }
      to   { left: calc(100% + 20px); }
    }

    #roach.squished {
      animation: squish 0.3s ease forwards;
    }

    @keyframes squish {
      0%   { transform: translateY(-50%) scaleY(1) scaleX(1); }
      40%  { transform: translateY(-50%) scaleY(0.15) scaleX(1.4); }
      100% { transform: translateY(-50%) scaleY(0.08) scaleX(1.6); opacity: 0.5; }
    }

    #stomp-circle {
      position: absolute;
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 4px dashed rgba(255,255,255,0.5);
      pointer-events: none;
      top: 50%;
      left: -60px;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    #hint {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      font-weight: 800;
      color: rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    #floor-line {
      position: absolute;
      bottom: 28%;
      left: 0; right: 0;
      height: 4px;
      background: rgba(0,0,0,0.15);
    }

    #pass-label {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      font-weight: 900;
      color: rgba(0,0,0,0.4);
    }

    #timer-bar-wrap { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: rgba(0,0,0,0.15); }
    #timer-bar { height: 100%; background: var(--color-accent); }

    #splat-label {
      position: absolute;
      font-size: 3rem;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      z-index: 5;
    }
  </style>
</head>
<body>
  <!-- START SCREEN -->
  <div id="start-screen" class="screen">
    <h1 class="game-title">STOMP</h1>
    <!-- TO REPLACE: <img src="art/subject.svg"> -->
    <div class="game-subject">🪳</div>
    <p class="game-tagline">Tap the cockroach before it escapes!<br>Win: Squished!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <div id="floor-line"></div>
      <div id="roach">🪳</div>
      <div id="stomp-circle"></div>
      <div id="hint">TAP the roach!</div>
      <div id="pass-label">Pass 1 / 2</div>
      <div id="splat-label">💀</div>
    </div>
  </div>

  <!-- WIN SCREEN -->
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">💀</div>
    <p class="game-tagline">Squished!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <!-- LOSE SCREEN -->
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">🪳</div>
    <p class="game-tagline">It escaped!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'stomp';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 8;

    function runTimer() {
      const elapsed = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - elapsed / TIME_LIMIT) * 100) + '%';
      if (elapsed >= TIME_LIMIT) { triggerLose(); return; }
      if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin()  { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 600); }
    function triggerLose() { gameRunning = false; show('lose'); }

    const roach = document.getElementById('roach');
    const stomper = document.getElementById('stomp-circle');
    const passLabel = document.getElementById('pass-label');
    const splatLabel = document.getElementById('splat-label');
    const CRAWL_DUR = 5.0;
    let pass = 0;
    const MAX_PASSES = 2;
    let stomped = false;

    function launchPass() {
      pass++;
      passLabel.textContent = `Pass ${pass} / ${MAX_PASSES}`;
      stomped = false;
      roach.style.opacity = '1';
      roach.classList.remove('squished');
      roach.classList.remove('crawling');
      roach.offsetHeight;
      roach.style.setProperty('--crawl-dur', CRAWL_DUR + 's');
      roach.classList.add('crawling');

      roach.addEventListener('animationend', () => {
        if (!gameRunning || stomped) return;
        if (pass < MAX_PASSES) {
          // give another pass
          setTimeout(launchPass, 300);
        } else {
          triggerLose();
        }
      }, { once: true });
    }

    function getRoachCenter() {
      const r = roach.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function onTap(e) {
      if (!gameRunning || stomped) return;
      const pt = e.touches ? e.touches[0] : e;
      const rc = getRoachCenter();
      const dist = Math.hypot(pt.clientX - rc.x, pt.clientY - rc.y);
      if (dist < 70) {
        stomped = true;
        roach.classList.remove('crawling');
        roach.classList.add('squished');
        splatLabel.style.opacity = '1';
        splatLabel.style.left = (rc.x) + 'px';
        splatLabel.style.top  = (rc.y) + 'px';
        setTimeout(() => { splatLabel.style.opacity = '0'; }, 500);
        triggerWin();
      }
    }

    document.getElementById('game-screen').addEventListener('touchstart', onTap, { passive: true });
    document.getElementById('game-screen').addEventListener('mousedown', onTap);

    function startGame() {
      show('game');
      gameRunning = true;
      stomped = false;
      pass = 0;
      splatLabel.style.opacity = '0';
      roach.classList.remove('squished', 'crawling');
      roach.style.animation = 'none';
      roach.style.left = '-60px';
      roach.style.opacity = '1';
      roach.offsetHeight;

      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      setTimeout(launchPass, 200);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
