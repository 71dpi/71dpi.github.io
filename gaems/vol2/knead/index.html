<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>KNEAD</title>
  <meta name="theme-color" content="#F5DEB3">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #F5DEB3; --color-accent: #8B4513; }
    #game-area { position:relative; width:min(300px,85vw); height:min(180px,50vw); margin:0 auto; touch-action:none; cursor:grab; }
    #dough-svg { width:100%; height:100%; }
    #timer-bar-wrap { width:min(300px,85vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #knead-label { font-weight:900; font-size:1.2rem; letter-spacing:0.05em; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">KNEAD</h1>
    <div class="game-subject">🫓</div>
    <p class="game-tagline">Swipe the dough back and forth<br>Win: 10 kneads</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back to game hub">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <svg id="dough-svg" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse id="dough-body" cx="150" cy="90" rx="120" ry="65" fill="#F0CE88" stroke="#8B4513" stroke-width="4"/>
        <ellipse cx="150" cy="85" rx="80" ry="38" fill="#F5DEB3" opacity="0.5"/>
        <circle cx="105" cy="72" r="7" fill="white" opacity="0.5"/>
        <circle cx="200" cy="108" r="5" fill="white" opacity="0.45"/>
        <circle cx="155" cy="62" r="4" fill="white" opacity="0.4"/>
        <circle cx="80" cy="100" r="5" fill="white" opacity="0.35"/>
        <circle cx="230" cy="78" r="6" fill="white" opacity="0.4"/>
      </svg>
    </div>
    <p id="knead-label">KNEAD IT!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🫓</div>
    <p class="game-tagline">Perfect dough!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">TIME'S UP!</p>
    <div class="game-subject anim-shake">🫓</div>
    <p class="game-tagline">Dough not ready!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'knead';
    const TIME_LIMIT = 8;
    const KNEADS_NEEDED = 10;
    const screens = { start:document.getElementById('start-screen'), game:document.getElementById('game-screen'), win:document.getElementById('win-screen'), lose:document.getElementById('lose-screen') };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }
    let kneads=0, lastX=null, lastDir=0, gameRunning=false, timerStart=0, timerRAF=0;
    const gameArea=document.getElementById('game-area'), doughBody=document.getElementById('dough-body'), label=document.getElementById('knead-label');
    function updateLabel() { label.textContent = kneads>=KNEADS_NEEDED ? 'DONE!' : kneads+' / '+KNEADS_NEEDED+' KNEADS'; }
    function squishDough(dir) {
      doughBody.setAttribute('rx', dir>0?'135':'108'); doughBody.setAttribute('ry', dir>0?'60':'76');
      setTimeout(()=>{ doughBody.setAttribute('rx','120'); doughBody.setAttribute('ry','65'); }, 120);
    }
    function handleMove(x) {
      if (lastX===null) { lastX=x; return; }
      const dx=x-lastX; lastX=x;
      if (Math.abs(dx)<4) return;
      const dir=dx>0?1:-1;
      if (dir!==lastDir) { lastDir=dir; kneads++; squishDough(dir); updateLabel(); if (kneads>=KNEADS_NEEDED) triggerWin(); }
    }
    gameArea.addEventListener('touchstart',e=>{ if(!gameRunning)return; e.preventDefault(); lastX=e.changedTouches[0].clientX; lastDir=0; },{passive:false});
    gameArea.addEventListener('touchmove',e=>{ if(!gameRunning)return; e.preventDefault(); handleMove(e.changedTouches[0].clientX); },{passive:false});
    gameArea.addEventListener('touchend',()=>{ lastX=null; });
    let mouseDown=false;
    gameArea.addEventListener('mousedown',e=>{ if(gameRunning){mouseDown=true; lastX=e.clientX; lastDir=0;} });
    gameArea.addEventListener('mousemove',e=>{ if(gameRunning&&mouseDown) handleMove(e.clientX); });
    gameArea.addEventListener('mouseup',()=>{ mouseDown=false; lastX=null; });
    function runTimer() {
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if (elapsed>=TIME_LIMIT) triggerLose(); else if (gameRunning) timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning=false; cancelAnimationFrame(timerRAF); setTimeout(()=>show('win'),300); }
    function triggerLose() { gameRunning=false; show('lose'); }
    function startGame() {
      kneads=0; lastX=null; lastDir=0; doughBody.setAttribute('rx','120'); doughBody.setAttribute('ry','65'); updateLabel();
      show('game'); gameRunning=true; timerStart=Date.now(); timerRAF=requestAnimationFrame(runTimer);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{ document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle); document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG)); });
  </script>
</body>
</html>
