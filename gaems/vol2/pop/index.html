<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>POP</title>
  <meta name="theme-color" content="#FF3EDB">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF3EDB; --color-accent: #FFF200; }
    #game-screen { background: #FF3EDB; }

    #pop-area {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }

    #bubble-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: min(340px, 90vw);
    }

    .bubble {
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(255,255,255,0.3) 50%, rgba(200,200,255,0.4));
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: inset -2px -2px 6px rgba(0,0,0,0.15), 2px 2px 4px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.05s, opacity 0.05s;
      position: relative;
      overflow: hidden;
    }

    .bubble::after {
      content: '';
      position: absolute;
      top: 15%; left: 20%;
      width: 30%; height: 20%;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    .bubble.popped {
      animation: pop-anim 0.25s forwards;
    }

    @keyframes pop-anim {
      0%   { transform: scale(1.3); opacity: 1; }
      40%  { transform: scale(1.5); opacity: 0.6; }
      100% { transform: scale(0); opacity: 0; }
    }

    #hud {
      font-weight: 900;
      font-size: 2rem;
      color: #000;
    }

    #timer-bar-wrap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: rgba(0,0,0,0.2);
      z-index: 20;
    }
    #timer-bar { height: 100%; width: 100%; background: #FFF200; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">POP</h1>
    <div class="game-subject">💆</div>
    <p class="game-tagline">Pop all 20 bubbles!<br>Win: All popped!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="pop-area">
      <div id="hud">20 left</div>
      <div id="bubble-grid"></div>
    </div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🎉</div>
    <p class="game-tagline">All popped!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">💆</div>
    <p class="game-tagline">So close!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'pop';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 12;

    function runTimer() {
      const e = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - e / TIME_LIMIT) * 100) + '%';
      if (e >= TIME_LIMIT) triggerLose();
      else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; show('lose'); }

    // ── POP GAME ──
    const grid = document.getElementById('bubble-grid');
    const hud = document.getElementById('hud');
    const TOTAL = 20;
    let remaining = TOTAL;

    function buildGrid() {
      grid.innerHTML = '';
      remaining = TOTAL;
      hud.textContent = `${remaining} left`;
      for (let i = 0; i < TOTAL; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        b.dataset.idx = i;
        grid.appendChild(b);
      }
    }

    function popBubble(el) {
      if (!gameRunning || el.classList.contains('popped')) return;
      el.classList.add('popped');
      el.style.pointerEvents = 'none';
      remaining--;
      hud.textContent = remaining > 0 ? `${remaining} left` : 'All gone!';
      if (remaining === 0) triggerWin();
    }

    grid.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.classList.contains('bubble')) popBubble(el);
      }
    }, { passive: false });

    grid.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.classList.contains('bubble')) popBubble(el);
      }
    }, { passive: false });

    grid.addEventListener('click', e => {
      const el = e.target.closest('.bubble');
      if (el) popBubble(el);
    });

    function startGame() {
      buildGrid();
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
