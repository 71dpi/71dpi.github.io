<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SEW</title>
  <meta name="theme-color" content="#F3E5F5">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #F3E5F5; --color-accent: #6A1B9A; }
    #game-area { position:relative; width:min(300px,85vw); height:min(300px,85vw); margin:0 auto; }
    #sew-svg { width:100%; height:100%; touch-action:none; }
    #timer-bar-wrap { width:min(300px,85vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #sew-label { font-weight:900; font-size:1.1rem; letter-spacing:0.05em; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">SEW</h1>
    <div class="game-subject">🧷</div>
    <p class="game-tagline">Tap the dots in sequence to sew the pattern!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <svg id="sew-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Fabric background -->
        <rect x="0" y="0" width="300" height="300" fill="#F8EAF6"/>
        <!-- Fabric grid texture -->
        <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="20" y2="0" stroke="rgba(106,27,154,0.08)" stroke-width="1"/>
          <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(106,27,154,0.08)" stroke-width="1"/>
        </pattern>
        <rect x="0" y="0" width="300" height="300" fill="url(#grid)"/>
        <!-- Stitch thread lines (drawn as connected) -->
        <polyline id="thread-path" points="" fill="none" stroke="#CE93D8" stroke-width="3" stroke-dasharray="6 4"/>
        <!-- Dot sequence -->
        <circle id="dot-0" cx="80" cy="80" r="16" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3"/>
        <text x="80" y="86" text-anchor="middle" fill="#4A148C" font-size="14" font-weight="900" font-family="Inter,sans-serif">1</text>
        <circle id="dot-1" cx="220" cy="80" r="16" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3"/>
        <text x="220" y="86" text-anchor="middle" fill="#4A148C" font-size="14" font-weight="900" font-family="Inter,sans-serif">2</text>
        <circle id="dot-2" cx="150" cy="150" r="16" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3"/>
        <text x="150" y="156" text-anchor="middle" fill="#4A148C" font-size="14" font-weight="900" font-family="Inter,sans-serif">3</text>
        <circle id="dot-3" cx="80" cy="220" r="16" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3"/>
        <text x="80" y="226" text-anchor="middle" fill="#4A148C" font-size="14" font-weight="900" font-family="Inter,sans-serif">4</text>
        <circle id="dot-4" cx="220" cy="220" r="16" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="3"/>
        <text x="220" y="226" text-anchor="middle" fill="#4A148C" font-size="14" font-weight="900" font-family="Inter,sans-serif">5</text>
      </svg>
    </div>
    <p id="sew-label">TAP DOT 1!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">🧷</div>
    <p class="game-tagline">Perfect stitching!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">SNAG!</p>
    <div class="game-subject anim-shake">🧷</div>
    <p class="game-tagline">Wrong order!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='sew', TIME_LIMIT=10;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, step=0;
    const gameArea=document.getElementById('game-area'), label=document.getElementById('sew-label');
    const DOTS=[{cx:80,cy:80},{cx:220,cy:80},{cx:150,cy:150},{cx:80,cy:220},{cx:220,cy:220}];
    const threadPath=document.getElementById('thread-path');
    const SVG_W=300,SVG_H=300;

    function getSVGPos(cX,cY){const rect=gameArea.getBoundingClientRect();return{x:cX/rect.width*SVG_W,y:cY/rect.height*SVG_H};}

    function resetDots(){
      DOTS.forEach((_,i)=>{
        const d=document.getElementById('dot-'+i);
        d.setAttribute('fill','#E1BEE7');d.setAttribute('r','16');
      });
      threadPath.setAttribute('points','');
    }
    function highlightNext(){
      DOTS.forEach((_,i)=>{
        const d=document.getElementById('dot-'+i);
        d.setAttribute('fill',i===step?'#FFD600':'#E1BEE7');
        d.setAttribute('r',i===step?'20':'16');
      });
    }

    function handleTap(svgX,svgY){
      if(!gameRunning)return;
      const dist=DOTS.map((d,i)=>({i,dist:Math.hypot(svgX-d.cx,svgY-d.cy)}));
      const nearest=dist.sort((a,b)=>a.dist-b.dist)[0];
      if(nearest.dist>30)return;
      if(nearest.i===step){
        // Correct!
        const d=document.getElementById('dot-'+nearest.i);
        d.setAttribute('fill','#69F0AE');
        // Add to thread path
        const pts=threadPath.getAttribute('points');
        const dot=DOTS[nearest.i];
        threadPath.setAttribute('points',(pts?pts+' ':'')+dot.cx+','+dot.cy);
        step++;
        if(step>=DOTS.length){triggerWin();return;}
        label.textContent='TAP DOT '+(step+1)+'!';
        highlightNext();
      } else {
        triggerLose();
      }
    }
    gameArea.addEventListener('click',e=>handleTap(...Object.values(getSVGPos(e.clientX,e.clientY))));
    gameArea.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];const p=getSVGPos(t.clientX,t.clientY);handleTap(p.x,p.y);},{passive:false});

    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;cancelAnimationFrame(timerRAF);setTimeout(()=>show('win'),400);}
    function triggerLose(){gameRunning=false;show('lose');}
    function startGame(){
      step=0;resetDots();highlightNext();threadPath.setAttribute('points','');
      label.textContent='TAP DOT 1!';
      show('game');gameRunning=true;timerStart=Date.now();timerRAF=requestAnimationFrame(runTimer);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
