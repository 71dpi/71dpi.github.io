  <script>
    // Hash router: #shave → /gaems/vol2/shave/
    (function() {
      const hash = location.hash.slice(1).toLowerCase();
      if (hash && GAMES.includes(hash)) {
        location.replace(`/gaems/vol2/${hash}/`);
      }
    })();

    // Build the game grid
    const grid = document.getElementById('game-grid');

    // Track which games have been built (update this list as games are added)
    const BUILT = new Set([
      // Batch hand-built
      'shave',
      // Batch A
      'plug','sting','catch','sneeze','unroll','dunk','slice','defuse','balance',
      'zit','thread','stomp','swat','parallel',
      // Batch B
      'toast','lick','unlock','pluck','inflate','sort','ref','vacuum','scare',
      'whack','pour','stamp','wipe','crush',
      // Batch C
      'fish','twist','duck','peel','squeeze','match','zip','flip','hammer',
      'pet','brake','sharpen','mow','blow',
      // Batch D
      'shred','aim','scrub','stir','pop','type','fold','knock','clog',
      'paint','haul','feed','drill','toss',
      // Batch E
      'squirt','chop','dial','bake','sweep','tickle','jump','dodge',
      'saw','crack','iron','stack','lasso','charge',
      // Batch F
      'knead','wink','amp','spray','dig','cover','tune','swig','seal',
      'wrap','burst','melt','unbox','light',
      // Batch G
      'clip','paddle','grip','launch','shake','flick','plant','score',
      'sew','brush','erase','spin','lock','squash','win',
    ]);

    GAMES.forEach(slug => {
      const meta = GAME_META[slug];
      const built = BUILT.has(slug);
      const a = document.createElement(built ? 'a' : 'div');
      if (built) a.href = `/gaems/vol2/${slug}/`;
      a.className = 'hub-cell' + (built ? '' : ' coming-soon');
      a.setAttribute('aria-label', slug);
      a.innerHTML = `
        <span class="cell-emoji">${meta?.emoji ?? '🎮'}</span>
        <span class="cell-name">${slug.toUpperCase()}</span>
      `;
      grid.appendChild(a);
    });

    // W3 include polyfill (matches site pattern)
    function includeHTML() {
      var z, i, elmnt, file, xhttp;
      z = document.getElementsByTagName("*");
      for (i = 0; i < z.length; i++) {
        elmnt = z[i];
        file = elmnt.getAttribute("w3-include-html");
        if (file) {
          xhttp = new XMLHttpRequest();
          xhttp.onreadystatechange = function() {
            if (this.readyState == 4) {
              if (this.status == 200) elmnt.innerHTML = this.responseText;
              if (this.status == 404) elmnt.innerHTML = "Page not found.";
              elmnt.removeAttribute("w3-include-html");
              includeHTML();
            }
          };
          xhttp.open("GET", file, true);
          xhttp.send();
          return;
        }
      }
    }
    includeHTML();
  </script>
