<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Saw</title>
  <meta name="theme-color" content="#FF4500">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF4500; --color-accent: #FFF200; }
    #game-screen { background: #FF4500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    #log-area {
      position: relative; width: 280px;
    }
    #log {
      width: 100%; height: 60px; background: #8B4513;
      border-radius: 12px;
      box-shadow: 0 4px 0 #5c2d0a;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; user-select: none;
    }
    #saw-blade {
      position: absolute;
      top: -40px; left: 50%;
      width: 60px; height: 30px;
      background: #ccc;
      clip-path: polygon(0% 100%, 8% 0%, 17% 100%, 25% 0%, 33% 100%, 42% 0%, 50% 100%, 58% 0%, 67% 100%, 75% 0%, 83% 100%, 92% 0%, 100% 100%);
      transform: translateX(-50%);
      transition: left 0.05s;
    }
    #progress-wrap {
      width: 240px; height: 20px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden;
    }
    #progress-bar {
      height: 100%; width: 0%; background: #FFF200; border-radius: 10px; transition: width 0.1s;
    }
    #saw-zone {
      width: 280px; height: 100px; background: transparent;
      touch-action: none; cursor: ew-resize;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #stroke-count { font-size: 1.2rem; font-weight: 900; color: #FFF200; }
    #swipe-guide { font-size: 0.9rem; font-weight: 800; color: #fff; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">Saw</h1>
    <div class="game-subject">🪵</div>
    <p class="game-tagline">Swipe left-right to saw the log!<br>Win: 8 full strokes</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="log-area">
      <div id="saw-blade"></div>
      <div id="log">🪵</div>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="stroke-count">0 / 8 strokes</div>
    <div id="saw-zone">
      <div id="swipe-guide">← SWIPE LEFT & RIGHT →</div>
    </div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">✂️</div>
    <p class="game-tagline">Cut in half!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">🪵</div>
    <p class="game-tagline">Still in one piece!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'saw';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 8;
    let dirChanges, lastX, lastDir, sawX;
    const BLADE_MIN = 10, BLADE_MAX = 220; // left offset within log-area

    function runTimer() {
      const e = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - e / TIME_LIMIT) * 100) + '%';
      if (e >= TIME_LIMIT) triggerLose();
      else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; show('lose'); }

    function moveBlade(x) {
      const logArea = document.getElementById('log-area');
      const r = logArea.getBoundingClientRect();
      const relX = Math.max(BLADE_MIN, Math.min(BLADE_MAX, x - r.left));
      sawX = relX;
      document.getElementById('saw-blade').style.left = relX + 'px';
    }

    function onSawMove(clientX) {
      if (!gameRunning) return;
      moveBlade(clientX);
      if (lastX === undefined) { lastX = clientX; return; }
      const dx = clientX - lastX;
      if (Math.abs(dx) < 12) return;
      const dir = dx > 0 ? 1 : -1;
      if (lastDir !== undefined && dir !== lastDir) {
        dirChanges++;
        const strokes = Math.floor(dirChanges / 2);
        const pct = Math.min(strokes / 8 * 100, 100);
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('stroke-count').textContent = strokes + ' / 8 strokes';
        if (strokes >= 8) { triggerWin(); return; }
      }
      lastDir = dir;
      lastX = clientX;
    }

    const sz = document.getElementById('saw-zone');
    sz.addEventListener('touchstart', (e) => {
      e.preventDefault();
      lastX = e.touches[0].clientX;
      lastDir = undefined;
    }, { passive: false });
    sz.addEventListener('touchmove', (e) => {
      e.preventDefault();
      onSawMove(e.touches[0].clientX);
    }, { passive: false });
    sz.addEventListener('touchend', () => { lastX = undefined; lastDir = undefined; });
    sz.addEventListener('mousedown', (e) => { lastX = e.clientX; lastDir = undefined; });
    sz.addEventListener('mousemove', (e) => { if (e.buttons) onSawMove(e.clientX); });
    sz.addEventListener('mouseup', () => { lastX = undefined; lastDir = undefined; });

    function startGame() {
      dirChanges = 0; lastX = undefined; lastDir = undefined;
      cancelAnimationFrame(timerRAF);
      document.getElementById('progress-bar').style.width = '0%';
      document.getElementById('stroke-count').textContent = '0 / 8 strokes';
      document.getElementById('saw-blade').style.left = '50%';
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
