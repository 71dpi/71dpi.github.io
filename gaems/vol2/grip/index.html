<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GRIP</title>
  <meta name="theme-color" content="#FFF9C4">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FFF9C4; --color-accent: #F57F17; }
    #timer-bar-wrap { width:min(260px,75vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #grip-label { font-weight:900; font-size:1.1rem; letter-spacing:0.05em; }
    #hold-area { width:min(200px,58vw); height:min(200px,58vw); border-radius:50%; background:linear-gradient(135deg,#FFD600,#FF6B00); border:var(--stroke) solid #000; box-shadow:var(--shadow); display:flex;align-items:center;justify-content:center;font-size:3.5rem;touch-action:none;cursor:grab;user-select:none; transition:transform 0.1s,box-shadow 0.1s; }
    #grip-ring-wrap { width:min(200px,58vw); height:min(200px,58vw); position:relative; }
    #grip-ring-wrap svg { position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none; }
    #pct-text { font-weight:900;font-size:1.4rem;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#F57F17; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">GRIP</h1>
    <div class="game-subject">🏋️</div>
    <p class="game-tagline">Hold the button for 3 full seconds</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <div id="grip-ring-wrap">
        <div id="hold-area">🏋️</div>
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="10"/>
          <circle id="grip-ring" cx="100" cy="100" r="90" fill="none" stroke="#F57F17" stroke-width="10" stroke-dasharray="0 565" transform="rotate(-90,100,100)"/>
        </svg>
        <div id="pct-text">0%</div>
      </div>
    </div>
    <p id="grip-label">HOLD THE BARBELL!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">💪</div>
    <p class="game-tagline">Iron grip!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">DROPPED!</p>
    <div class="game-subject anim-shake">🏋️</div>
    <p class="game-tagline">Let go too soon!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='grip', TIME_LIMIT=7, HOLD_NEEDED=3.0;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, holding=false, holdStart=0, holdTotal=0, animRAF=0;
    const holdArea=document.getElementById('hold-area'), label=document.getElementById('grip-label');
    const ring=document.getElementById('grip-ring'), pctText=document.getElementById('pct-text');
    const CIRC=2*Math.PI*90;
    function startHold(){if(!gameRunning)return;holding=true;holdStart=Date.now()-holdTotal*1000;holdArea.style.transform='scale(0.93)';holdArea.style.boxShadow='1px 1px 0 #000';}
    function endHold(){if(!holding)return;holding=false;holdArea.style.transform='';holdArea.style.boxShadow='';label.textContent='HOLD THE BARBELL!';}
    holdArea.addEventListener('touchstart',e=>{e.preventDefault();startHold();},{passive:false});
    holdArea.addEventListener('touchend',e=>{e.preventDefault();endHold();},{passive:false});
    holdArea.addEventListener('mousedown',startHold);
    document.addEventListener('mouseup',endHold);
    function animLoop(){
      if(!gameRunning)return;
      if(holding){
        holdTotal=Math.min(HOLD_NEEDED,(Date.now()-holdStart)/1000);
        const pct=holdTotal/HOLD_NEEDED;
        ring.setAttribute('stroke-dasharray',pct*CIRC+' '+CIRC);
        pctText.textContent=Math.round(pct*100)+'%';
        label.textContent='HOLDING... '+Math.round(pct*100)+'%';
        if(holdTotal>=HOLD_NEEDED){triggerWin();return;}
      }
      animRAF=requestAnimationFrame(animLoop);
    }
    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;holding=false;cancelAnimationFrame(timerRAF);cancelAnimationFrame(animRAF);setTimeout(()=>show('win'),300);}
    function triggerLose(){gameRunning=false;holding=false;cancelAnimationFrame(animRAF);show('lose');}
    function startGame(){
      holdTotal=0;holding=false;ring.setAttribute('stroke-dasharray','0 '+CIRC);pctText.textContent='0%';
      holdArea.style.transform='';label.textContent='HOLD THE BARBELL!';
      show('game');gameRunning=true;timerStart=Date.now();
      timerRAF=requestAnimationFrame(runTimer);animRAF=requestAnimationFrame(animLoop);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
