<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LICK</title>
  <meta name="theme-color" content="#FFB800">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FFB800; --color-accent: #FF3EDB; }
    #game-screen { background: #FFB800; touch-action: none; }
    #ice-cream-zone {
      position: relative;
      width: 180px;
      margin: 0 auto;
      text-align: center;
    }
    #ice-cream {
      font-size: 8rem;
      line-height: 1;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
    #drip-container {
      position: absolute;
      left: 50%;
      top: 68px;
      transform: translateX(-50%);
      width: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    #drip {
      width: 18px;
      height: 28px;
      background: #60cfff;
      border-radius: 0 0 50% 50%;
      border: 3px solid #0090cc;
      position: relative;
      top: 0;
      transition: none;
    }
    #meter-wrap {
      width: 220px;
      height: 28px;
      background: #fff;
      border: 4px solid #000;
      border-radius: 14px;
      box-shadow: 3px 3px 0 #000;
      overflow: hidden;
      margin: 0 auto;
    }
    #meter-fill {
      height: 100%;
      width: 0%;
      background: #FF3EDB;
      border-radius: 10px;
      transition: width 0.1s;
    }
    #meter-label {
      font-size: 0.9rem;
      font-weight: 900;
      text-align: center;
      color: #000;
    }
    #swipe-hint {
      font-size: 1rem;
      font-weight: 900;
      text-align: center;
      color: #000;
      animation: pulse 1s ease infinite;
    }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">LICK</h1>
    <div class="game-subject">🍦</div>
    <p class="game-tagline">Swipe up and down on the ice cream!<br>Win: fill the lick meter before it drips!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <p id="swipe-hint">SWIPE THE ICE CREAM!</p>
    <div id="ice-cream-zone">
      <span id="ice-cream">🍦</span>
      <div id="drip-container"><div id="drip"></div></div>
    </div>
    <div style="height:0.75rem"></div>
    <p id="meter-label">LICKS: 0 / 20</p>
    <div id="meter-wrap"><div id="meter-fill"></div></div>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">😋</div>
    <p class="game-tagline">No drips!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">😢</div>
    <p class="game-tagline">It melted!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'lick';
    const screens = { start: document.getElementById('start-screen'), game: document.getElementById('game-screen'), win: document.getElementById('win-screen'), lose: document.getElementById('lose-screen') };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }
    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 10;
    function runTimer() {
      const e = (Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width = Math.max(0,(1-e/TIME_LIMIT)*100)+'%';
      if (e >= TIME_LIMIT) triggerLose(); else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning=false; cancelAnimationFrame(timerRAF); clearInterval(dripInterval); setTimeout(()=>show('win'),300); }
    function triggerLose() { gameRunning=false; cancelAnimationFrame(timerRAF); clearInterval(dripInterval); show('lose'); }

    // LICK GAME
    const iceCream = document.getElementById('ice-cream');
    const drip = document.getElementById('drip');
    const meterFill = document.getElementById('meter-fill');
    const meterLabel = document.getElementById('meter-label');
    const TOTAL_LICKS = 20;
    let licks = 0, lastY = null, isTracking = false, dripPos = 0, dripInterval;

    function updateMeter() {
      const pct = (licks / TOTAL_LICKS) * 100;
      meterFill.style.width = pct + '%';
      meterLabel.textContent = `LICKS: ${licks} / ${TOTAL_LICKS}`;
    }

    function onSwipeMove(y) {
      if (!gameRunning || !isTracking) return;
      if (lastY !== null) {
        const dy = Math.abs(y - lastY);
        if (dy > 8) {
          licks++;
          updateMeter();
          // flash the ice cream
          iceCream.style.transform = 'scale(1.15)';
          setTimeout(() => { iceCream.style.transform = ''; }, 80);
          if (licks >= TOTAL_LICKS) triggerWin();
          lastY = y;
        }
      } else {
        lastY = y;
      }
    }

    iceCream.addEventListener('touchstart', e => {
      if (!gameRunning) return;
      isTracking = true;
      lastY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    iceCream.addEventListener('touchmove', e => {
      onSwipeMove(e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });

    iceCream.addEventListener('touchend', () => { isTracking = false; lastY = null; });

    // mouse fallback
    iceCream.addEventListener('mousedown', e => { isTracking = true; lastY = e.clientY; });
    iceCream.addEventListener('mousemove', e => { if (isTracking) onSwipeMove(e.clientY); });
    iceCream.addEventListener('mouseup', () => { isTracking = false; lastY = null; });

    function startDrip() {
      dripPos = 0;
      drip.style.top = dripPos + 'px';
      // drip falls ~140px over 10 seconds = 1.4px per 100ms
      dripInterval = setInterval(() => {
        if (!gameRunning) return;
        dripPos += 1.4;
        drip.style.top = dripPos + 'px';
        if (dripPos > 140) triggerLose();
      }, 100);
    }

    function startGame() {
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
      licks = 0;
      updateMeter();
      isTracking = false;
      lastY = null;
      startDrip();
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
