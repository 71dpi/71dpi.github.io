<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MELT</title>
  <meta name="theme-color" content="#B3E5FC">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #B3E5FC; --color-accent: #0277BD; }
    #game-area { position:relative; width:min(260px,75vw); height:min(260px,75vw); margin:0 auto; touch-action:none; user-select:none; }
    #ice-svg { width:100%; height:100%; }
    #timer-bar-wrap { width:min(260px,75vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #melt-label { font-weight:900; font-size:1.1rem; letter-spacing:0.05em; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">MELT</h1>
    <div class="game-subject">🧊</div>
    <p class="game-tagline">Hold your finger on the ice cube until it melts<br>Win: hold 3 seconds</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <svg id="ice-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Water puddle (grows) -->
        <ellipse id="puddle" cx="130" cy="230" rx="0" ry="0" fill="rgba(41,182,246,0.4)"/>
        <!-- Ice cube -->
        <g id="ice-group">
          <rect id="ice-body" x="65" y="70" width="130" height="130" rx="12" fill="#B3E5FC" stroke="#29B6F6" stroke-width="4"/>
          <rect x="75" y="80" width="50" height="50" rx="6" fill="rgba(255,255,255,0.5)"/>
          <rect x="140" y="135" width="40" height="40" rx="5" fill="rgba(255,255,255,0.3)"/>
          <!-- Shine -->
          <ellipse cx="100" cy="100" rx="20" ry="12" fill="rgba(255,255,255,0.6)" transform="rotate(-30,100,100)"/>
          <!-- Crack lines (appear while melting) -->
          <path id="crack1" d="M110,120 Q120,135 115,155" stroke="rgba(41,182,246,0.5)" stroke-width="2" fill="none" opacity="0"/>
          <path id="crack2" d="M145,90 Q155,110 148,130" stroke="rgba(41,182,246,0.5)" stroke-width="2" fill="none" opacity="0"/>
          <!-- Drip -->
          <ellipse id="drip1" cx="130" cy="200" rx="0" ry="0" fill="#29B6F6"/>
        </g>
        <!-- Hold progress ring -->
        <circle id="hold-ring" cx="130" cy="135" r="78" fill="none" stroke="#FF6B00" stroke-width="5" stroke-dasharray="0 490" transform="rotate(-90,130,135)" opacity="0.8"/>
        <!-- Finger hint -->
        <text id="finger-hint" x="130" y="155" text-anchor="middle" font-size="48" fill="rgba(0,0,0,0.15)">👆</text>
      </svg>
    </div>
    <p id="melt-label">HOLD THE ICE!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">💧</div>
    <p class="game-tagline">Totally melted!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">TIME'S UP!</p>
    <div class="game-subject anim-shake">🧊</div>
    <p class="game-tagline">Still frozen!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='melt', TIME_LIMIT=8, HOLD_NEEDED=3.0;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, holding=false, holdStart=0, holdTotal=0, animRAF=0;
    const gameArea=document.getElementById('game-area'), label=document.getElementById('melt-label');
    const iceBody=document.getElementById('ice-body'), puddle=document.getElementById('puddle');
    const ring=document.getElementById('hold-ring'), crack1=document.getElementById('crack1'), crack2=document.getElementById('crack2');
    const drip1=document.getElementById('drip1'), fingerHint=document.getElementById('finger-hint'), iceGroup=document.getElementById('ice-group');
    const CIRC=2*Math.PI*78;

    function updateMelt(){
      const pct=holdTotal/HOLD_NEEDED;
      ring.setAttribute('stroke-dasharray',pct*CIRC+' '+CIRC);
      // Shrink ice
      const s=1-pct*0.5;
      iceGroup.setAttribute('transform','translate('+(130*(1-s))+','+(135*(1-s))+') scale('+s+')');
      // Grow puddle
      puddle.setAttribute('rx',pct*60); puddle.setAttribute('ry',pct*18);
      // Cracks appear halfway
      if(pct>0.4){crack1.setAttribute('opacity','1');crack2.setAttribute('opacity','1');}
      // Drip
      const dripSize=pct*8;
      drip1.setAttribute('rx',dripSize); drip1.setAttribute('ry',dripSize);
      drip1.setAttribute('cy',200+pct*20);
      label.textContent=pct>=1?'MELTING!':Math.round(pct*100)+'% MELTED';
      fingerHint.setAttribute('opacity',holding?'0':'0.15');
    }

    function startHold(){if(!gameRunning)return;holding=true;holdStart=Date.now()-holdTotal*1000;}
    function endHold(){holding=false;label.textContent='HOLD THE ICE!';}

    gameArea.addEventListener('touchstart',e=>{e.preventDefault();startHold();},{passive:false});
    gameArea.addEventListener('touchend',e=>{e.preventDefault();endHold();},{passive:false});
    gameArea.addEventListener('mousedown',startHold);
    document.addEventListener('mouseup',endHold);

    function animLoop(){
      if(!gameRunning)return;
      if(holding){
        holdTotal=Math.min(HOLD_NEEDED,(Date.now()-holdStart)/1000);
        updateMelt();
        if(holdTotal>=HOLD_NEEDED){triggerWin();return;}
      }
      animRAF=requestAnimationFrame(animLoop);
    }
    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;holding=false;cancelAnimationFrame(timerRAF);cancelAnimationFrame(animRAF);setTimeout(()=>show('win'),400);}
    function triggerLose(){gameRunning=false;holding=false;cancelAnimationFrame(animRAF);show('lose');}
    function startGame(){
      holdTotal=0;holding=false;
      iceBody.setAttribute('fill','#B3E5FC');
      iceGroup.setAttribute('transform','');
      puddle.setAttribute('rx',0);puddle.setAttribute('ry',0);
      drip1.setAttribute('rx',0);drip1.setAttribute('ry',0);
      crack1.setAttribute('opacity',0);crack2.setAttribute('opacity',0);
      ring.setAttribute('stroke-dasharray','0 '+CIRC);
      fingerHint.setAttribute('opacity','0.15');
      label.textContent='HOLD THE ICE!';
      show('game');gameRunning=true;timerStart=Date.now();
      timerRAF=requestAnimationFrame(runTimer);
      animRAF=requestAnimationFrame(animLoop);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
