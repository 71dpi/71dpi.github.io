<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SQUASH</title>
  <meta name="theme-color" content="#FFF3E0">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FFF3E0; --color-accent: #E65100; }
    #game-area { position:relative; width:min(280px,80vw); height:min(320px,90vw); margin:0 auto; touch-action:none; }
    #squash-svg { width:100%; height:100%; }
    #timer-bar-wrap { width:min(280px,80vw); height:14px; background:#fff; border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:var(--color-accent); width:100%; transform-origin:left; }
    #squash-label { font-weight:900; font-size:1.1rem; letter-spacing:0.05em; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">SQUASH</h1>
    <div class="game-subject">🥔</div>
    <p class="game-tagline">Tap the masher 5 times to squash the potato!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <svg id="squash-svg" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Bowl -->
        <ellipse cx="140" cy="270" rx="100" ry="30" fill="#BDBDBD" stroke="#000" stroke-width="3"/>
        <path d="M50,230 Q50,300 140,300 Q230,300 230,230 L230,270 Q230,300 140,300 Q50,300 50,270 Z" fill="#E0E0E0" stroke="#000" stroke-width="3"/>
        <!-- Potato (gets flattened) -->
        <ellipse id="potato" cx="140" cy="230" rx="60" ry="35" fill="#F5DEB3" stroke="#8B4513" stroke-width="3"/>
        <!-- Potato eyes -->
        <circle cx="120" cy="228" r="4" fill="#8B4513"/>
        <circle cx="160" cy="228" r="4" fill="#8B4513"/>
        <!-- Masher handle -->
        <rect id="masher-handle" x="128" y="50" width="24" height="120" rx="8" fill="#795548" stroke="#000" stroke-width="3"/>
        <!-- Masher head -->
        <g id="masher-head" transform="translate(140,170)">
          <rect x="-50" y="0" width="100" height="16" rx="4" fill="#5D4037" stroke="#000" stroke-width="3"/>
          <rect x="-45" y="16" width="10" height="20" rx="3" fill="#5D4037" stroke="#000" stroke-width="2"/>
          <rect x="-25" y="16" width="10" height="20" rx="3" fill="#5D4037" stroke="#000" stroke-width="2"/>
          <rect x="-5" y="16" width="10" height="20" rx="3" fill="#5D4037" stroke="#000" stroke-width="2"/>
          <rect x="15" y="16" width="10" height="20" rx="3" fill="#5D4037" stroke="#000" stroke-width="2"/>
          <rect x="35" y="16" width="10" height="20" rx="3" fill="#5D4037" stroke="#000" stroke-width="2"/>
        </g>
        <!-- Progress -->
        <text id="squash-count" x="140" y="155" text-anchor="middle" fill="#E65100" font-size="22" font-weight="900" font-family="Inter,sans-serif">0/5</text>
      </svg>
    </div>
    <p id="squash-label">TAP THE MASHER!</p>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">MASH!</p>
    <div class="game-subject anim-bounce">🥔</div>
    <p class="game-tagline">Perfectly mashed!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">TIME'S UP!</p>
    <div class="game-subject anim-shake">🥔</div>
    <p class="game-tagline">Still lumpy!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='squash', TIME_LIMIT=6, MASHES_NEEDED=5;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, mashes=0, animating=false;
    const gameArea=document.getElementById('game-area'), label=document.getElementById('squash-label');
    const masherHandle=document.getElementById('masher-handle'), masherHead=document.getElementById('masher-head');
    const potato=document.getElementById('potato'), countText=document.getElementById('squash-count');

    function doMash(){
      if(!gameRunning||animating)return;
      animating=true;
      // Animate masher down
      masherHandle.setAttribute('y','90'); masherHandle.setAttribute('height','80');
      masherHead.setAttribute('transform','translate(140,210)');
      // Flatten potato
      mashes++;
      const pct=mashes/MASHES_NEEDED;
      potato.setAttribute('ry',Math.max(10,35-pct*20));
      potato.setAttribute('rx',Math.min(80,60+pct*20));
      countText.textContent=mashes+'/'+MASHES_NEEDED;
      label.textContent=mashes>=MASHES_NEEDED?'DONE!':'TAP AGAIN! '+(MASHES_NEEDED-mashes)+' MORE';
      setTimeout(()=>{
        masherHandle.setAttribute('y','50');masherHandle.setAttribute('height','120');
        masherHead.setAttribute('transform','translate(140,170)');
        animating=false;
        if(mashes>=MASHES_NEEDED)triggerWin();
      },180);
    }

    gameArea.addEventListener('click',doMash);
    gameArea.addEventListener('touchend',e=>{e.preventDefault();doMash();},{passive:false});

    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;cancelAnimationFrame(timerRAF);setTimeout(()=>show('win'),400);}
    function triggerLose(){gameRunning=false;show('lose');}
    function startGame(){
      mashes=0;animating=false;
      potato.setAttribute('ry','35');potato.setAttribute('rx','60');
      masherHandle.setAttribute('y','50');masherHandle.setAttribute('height','120');
      masherHead.setAttribute('transform','translate(140,170)');
      countText.textContent='0/'+MASHES_NEEDED;
      label.textContent='TAP THE MASHER!';
      show('game');gameRunning=true;timerStart=Date.now();timerRAF=requestAnimationFrame(runTimer);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
