<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Charge</title>
  <meta name="theme-color" content="#FF0062">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #FF0062; --color-accent: #FFF200; }
    #game-screen { background: #FF0062; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; touch-action: none; }
    #bolt {
      font-size: 6rem; line-height: 1; user-select: none;
      transition: transform 0.05s;
    }
    #bolt.pulse { animation: bolt-pulse 0.15s ease-out; }
    @keyframes bolt-pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.25); filter: brightness(1.4); }
      100% { transform: scale(1); }
    }
    #bar-wrap {
      width: 240px; height: 30px;
      background: rgba(0,0,0,0.2); border-radius: 15px; overflow: hidden;
    }
    #charge-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #FFF200, #ffee00);
      border-radius: 15px; transition: width 0.08s;
    }
    #charge-bar.nearly {
      animation: bar-pulse 0.2s infinite alternate;
    }
    @keyframes bar-pulse {
      from { filter: brightness(1); }
      to   { filter: brightness(1.4); box-shadow: 0 0 20px #FFF200; }
    }
    #tap-count { font-size: 1.2rem; font-weight: 900; color: #FFF200; }
    #tap-btn {
      width: 160px; height: 160px; border-radius: 50%;
      background: #FFF200; border: none; cursor: pointer;
      font-size: 3.5rem; font-weight: 900;
      box-shadow: 0 8px 0 #b8aa00;
      touch-action: manipulation; user-select: none;
      transition: transform 0.05s, box-shadow 0.05s;
    }
    #tap-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #b8aa00; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">Charge</h1>
    <div class="game-subject">⚡</div>
    <p class="game-tagline">Tap as fast as you can!<br>Win: Fill the bar (15 taps)</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle">🔀</button>
      <button class="btn-icon" id="btn-share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="bolt">⚡</div>
    <div id="bar-wrap"><div id="charge-bar"></div></div>
    <div id="tap-count">0 / 15</div>
    <button id="tap-btn">⚡</button>
  </div>

  <div id="win-screen" class="screen hidden">
    <p class="result-label">WIN!</p>
    <div class="game-subject anim-bounce">💥</div>
    <p class="game-tagline">Attacked!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <div id="lose-screen" class="screen hidden">
    <p class="result-label">LOSE!</p>
    <div class="game-subject anim-shake">⚡</div>
    <p class="game-tagline">Out of power!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>

  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG = 'charge';
    const screens = {
      start: document.getElementById('start-screen'),
      game:  document.getElementById('game-screen'),
      win:   document.getElementById('win-screen'),
      lose:  document.getElementById('lose-screen'),
    };
    function show(n) { Object.values(screens).forEach(s => s.classList.add('hidden')); screens[n].classList.remove('hidden'); }

    let gameRunning = false, timerStart, timerRAF;
    const TIME_LIMIT = 7;
    let tapCount;
    const TAPS_NEEDED = 15;
    const PCT_PER_TAP = 100 / TAPS_NEEDED;

    function runTimer() {
      const e = (Date.now() - timerStart) / 1000;
      document.getElementById('timer-bar').style.width = Math.max(0, (1 - e / TIME_LIMIT) * 100) + '%';
      if (e >= TIME_LIMIT) triggerLose();
      else if (gameRunning) timerRAF = requestAnimationFrame(runTimer);
    }
    function triggerWin() { gameRunning = false; cancelAnimationFrame(timerRAF); setTimeout(() => show('win'), 300); }
    function triggerLose() { gameRunning = false; show('lose'); }

    function onTap() {
      if (!gameRunning) return;
      tapCount++;
      const pct = Math.min(tapCount * PCT_PER_TAP, 100);
      const bar = document.getElementById('charge-bar');
      bar.style.width = pct + '%';
      bar.classList.toggle('nearly', pct >= 80);

      const bolt = document.getElementById('bolt');
      bolt.classList.remove('pulse');
      void bolt.offsetWidth;
      bolt.classList.add('pulse');

      document.getElementById('tap-count').textContent = tapCount + ' / ' + TAPS_NEEDED;

      if (tapCount >= TAPS_NEEDED) {
        bar.style.width = '100%';
        triggerWin();
      }
    }

    const tapBtn = document.getElementById('tap-btn');
    tapBtn.addEventListener('click', onTap);
    tapBtn.addEventListener('touchstart', (e) => { e.preventDefault(); onTap(); }, { passive: false });

    function startGame() {
      tapCount = 0;
      cancelAnimationFrame(timerRAF);
      const bar = document.getElementById('charge-bar');
      bar.style.width = '0%';
      bar.classList.remove('nearly');
      document.getElementById('tap-count').textContent = '0 / ' + TAPS_NEEDED;
      document.getElementById('bolt').classList.remove('pulse');
      show('game');
      gameRunning = true;
      timerStart = Date.now();
      timerRAF = requestAnimationFrame(runTimer);
    }

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-replay-win').addEventListener('click', startGame);
    document.getElementById('btn-replay-lose').addEventListener('click', startGame);
    wireFooter(SLUG);
    ['win', 'lose'].forEach(s => {
      document.getElementById(`btn-shuffle-${s}`)?.addEventListener('click', shuffle);
      document.getElementById(`btn-share-${s}`)?.addEventListener('click', () => shareGame(SLUG));
    });
  </script>
</body>
</html>
