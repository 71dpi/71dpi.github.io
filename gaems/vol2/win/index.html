<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WIN</title>
  <meta name="theme-color" content="#00D66B">
  <link rel="stylesheet" href="/gaems/vol2/shared.css" />
  <style>
    :root { --color-bg: #00D66B; --color-accent: #000; --color-ink: #000; }
    body { background: var(--color-bg); }
    .screen { background: var(--color-bg); }
    #game-area { position:relative; width:min(300px,85vw); margin:0 auto; display:flex;flex-direction:column;align-items:center;gap:1rem; }
    #timer-bar-wrap { width:min(300px,85vw); height:14px; background:rgba(0,0,0,0.2); border:var(--stroke) solid #000; border-radius:99px; overflow:hidden; box-shadow:var(--shadow); }
    #timer-bar { height:100%; background:#000; width:100%; transform-origin:left; }
    #btn-win { font-size:clamp(2rem,12vw,4rem); padding:1.5rem 3rem; background:#FFD700; border:var(--stroke) solid #000; border-radius:var(--radius); box-shadow:var(--shadow); cursor:pointer; touch-action:none; animation:pulse 0.8s ease infinite; }
    #countdown { font-size:clamp(3rem,18vw,6rem); font-weight:900; color:#000; line-height:1; }
    #win-label { font-weight:900; font-size:1.2rem; color:#000; letter-spacing:0.05em; text-align:center; }
    .btn { color:#000; }
    .btn-icon { background:#fff; }
  </style>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 class="game-title">WIN</h1>
    <div class="game-subject">🏆</div>
    <p class="game-tagline">Tap the WIN button before time runs out!</p>
    <button class="btn btn-play" id="btn-play">PLAY</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71" aria-label="Back">71</a>
      <button class="btn-icon" id="btn-shuffle" aria-label="Shuffle">🔀</button>
      <button class="btn-icon" id="btn-share" aria-label="Share">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon" aria-label="Ko-fi">☕</a>
    </footer>
  </div>
  <div id="game-screen" class="screen hidden">
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="game-area">
      <p id="countdown">3</p>
      <button id="btn-win" class="btn">🏆 WIN</button>
      <p id="win-label">TAP IT!</p>
    </div>
  </div>
  <div id="win-screen" class="screen hidden">
    <p class="result-label">YOU WIN!</p>
    <div class="game-subject anim-bounce">🏆</div>
    <p class="game-tagline">You tapped WIN! You really did it!</p>
    <button class="btn btn-replay" id="btn-replay-win">PLAY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-win">🔀</button>
      <button class="btn-icon" id="btn-share-win">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <div id="lose-screen" class="screen hidden">
    <p class="result-label">TOO SLOW!</p>
    <div class="game-subject anim-shake">😤</div>
    <p class="game-tagline">You had one job!</p>
    <button class="btn btn-replay" id="btn-replay-lose">TRY AGAIN</button>
    <footer class="game-footer">
      <a href="/gaems/vol2/" class="btn-icon btn-icon-71">71</a>
      <button class="btn-icon" id="btn-shuffle-lose">🔀</button>
      <button class="btn-icon" id="btn-share-lose">⤴</button>
      <a href="https://ko-fi.com/71dpi" target="_blank" rel="noopener" class="btn-icon">☕</a>
    </footer>
  </div>
  <script src="/gaems/vol2/shared.js"></script>
  <script>
    const SLUG='win', TIME_LIMIT=5;
    const screens={start:document.getElementById('start-screen'),game:document.getElementById('game-screen'),win:document.getElementById('win-screen'),lose:document.getElementById('lose-screen')};
    function show(n){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[n].classList.remove('hidden');}
    let gameRunning=false, timerStart=0, timerRAF=0, countdownInterval=null;
    const countdown=document.getElementById('countdown'), winLabel=document.getElementById('win-label');
    const btnWin=document.getElementById('btn-win');

    function handleWin(){if(!gameRunning)return;triggerWin();}
    btnWin.addEventListener('click',handleWin);
    btnWin.addEventListener('touchend',e=>{e.preventDefault();handleWin();},{passive:false});

    let wobbleInterval=null;
    function startWobble(){
      let t=0;
      wobbleInterval=setInterval(()=>{
        if(!gameRunning){clearInterval(wobbleInterval);return;}
        t++;
        const x=(Math.random()-0.5)*14*(1+t*0.08), y=(Math.random()-0.5)*8*(1+t*0.04);
        btnWin.style.transform='translate('+x+'px,'+y+'px)';
        winLabel.textContent=t<3?'TAP IT!':t<6?'HURRY!':'TAP WIN NOW!!';
      },400);
    }

    function runTimer(){
      const elapsed=(Date.now()-timerStart)/1000;
      document.getElementById('timer-bar').style.width=(Math.max(0,1-elapsed/TIME_LIMIT)*100)+'%';
      const remaining=Math.ceil(TIME_LIMIT-elapsed);
      countdown.textContent=Math.max(0,remaining);
      if(elapsed>=TIME_LIMIT)triggerLose();else if(gameRunning)timerRAF=requestAnimationFrame(runTimer);
    }
    function triggerWin(){gameRunning=false;cancelAnimationFrame(timerRAF);clearInterval(wobbleInterval);clearInterval(countdownInterval);btnWin.style.transform='';setTimeout(()=>show('win'),200);}
    function triggerLose(){gameRunning=false;clearInterval(wobbleInterval);btnWin.style.transform='';show('lose');}
    function startGame(){
      clearInterval(wobbleInterval);btnWin.style.transform='';
      winLabel.textContent='TAP IT!';countdown.textContent=TIME_LIMIT;
      show('game');gameRunning=true;timerStart=Date.now();timerRAF=requestAnimationFrame(runTimer);
      setTimeout(startWobble,500);
    }
    document.getElementById('btn-play').addEventListener('click',startGame);
    document.getElementById('btn-replay-win').addEventListener('click',startGame);
    document.getElementById('btn-replay-lose').addEventListener('click',startGame);
    wireFooter(SLUG);
    ['win','lose'].forEach(s=>{document.getElementById('btn-shuffle-'+s)?.addEventListener('click',shuffle);document.getElementById('btn-share-'+s)?.addEventListener('click',()=>shareGame(SLUG));});
  </script>
</body>
</html>
